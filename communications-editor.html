<!doctype html><meta charset="utf-8"><title>短信与电话本地编辑器</title><style>body{font:15px system-ui;background:#f2f3f6;max-width:1100px;margin:30px auto;padding:20px}section{background:white;padding:20px;border-radius:16px;margin:18px 0}input,textarea,select,button{font:inherit;padding:10px;margin:5px;border:1px solid #ddd;border-radius:8px}textarea{width:90%;min-height:70px}button{cursor:pointer;background:#dceedd}.entry{padding:12px;border-bottom:1px solid #ddd}label{display:block}small{color:#777}</style>
<h1>短信与电话编辑器</h1><button id="export">导出数据</button><input type="file" id="import" accept="application/json"><a href="index.html" target="_blank">打开手机预览</a><p id="status"></p>
<section><h2>收到的短信</h2><button id="addSms">＋ 短信</button><div id="sms"></div></section><section><h2>通话记录</h2><button id="addCall">＋ 电话记录</button><div id="calls"></div></section>
<script>
let data={sms:[],calls:[]};const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function sortCommunicationData(){for(const kind of ['sms','calls'])data[kind].sort((a,b)=>String(b.date||'').replace(/\D/g,'').slice(0,10).padEnd(10,'0').localeCompare(String(a.date||'').replace(/\D/g,'').slice(0,10).padEnd(10,'0')))}
function normalizeCommunicationDate(value){const digits=value.replace(/\D/g,'');return digits.length===6?digits.slice(0,2)+'.'+digits.slice(2,4)+'.'+digits.slice(4):value}
function save(){try{localStorage.setItem('communications-editor',JSON.stringify(data));$('#status').textContent='草稿已保存'}catch{$('#status').textContent='保存失败，请导出备份'}}
function render(){sortCommunicationData();for(const [kind,fields] of [['sms',['sender','date','text','category']],['calls',['name','number','date','duration','type','category']]]){const box=$('#'+kind);box.replaceChildren();data[kind].forEach((item,i)=>{const row=document.createElement('div');row.className='entry';for(const field of fields){const el=field==='text'?document.createElement('textarea'):(field==='type'||field==='category')?document.createElement('select'):document.createElement('input');if(field==='type')el.innerHTML='<option value="incoming">来电</option><option value="missed">未接</option><option value="outgoing">拨出</option>';if(field==='category')el.innerHTML='<option value="recent">最近</option><option value="history">历史</option>';el.placeholder={sender:'发送者／号码',date:'日期时间',text:'短信正文',name:'联系人',number:'号码',duration:'时长，例如 2分钟'}[field]||field;el.value=item[field]||(field==='category'?'recent':'');el.oninput=()=>{item[field]=el.value;save()};if(field==='date'){el.placeholder='六位年月日，例如 260827';el.onchange=()=>{item.date=normalizeCommunicationDate(el.value);sortCommunicationData();save();render()}}row.append(el)}const del=document.createElement('button');del.textContent='删除';del.onclick=()=>{data[kind].splice(i,1);save();render()};row.append(del);box.append(row)})}}
$('#addSms').onclick=()=>{data.sms.push({sender:'',date:'',text:''});save();render()};$('#addCall').onclick=()=>{data.calls.push({name:'',number:'',date:'',duration:'',type:'incoming'});save();render()};$('#export').onclick=()=>{sortCommunicationData();const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='communications-data.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('#import').onchange=async e=>{try{const d=JSON.parse(await e.target.files[0].text());if(!Array.isArray(d.sms)||!Array.isArray(d.calls))throw Error('格式不正确');data=d;save();render()}catch(err){$('#status').textContent=err.message}};
try{data=JSON.parse(localStorage.getItem('communications-editor'))||data}catch{}render();
</script>
