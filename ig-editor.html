<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IG 编辑器 · Instagram Editor</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#1a1a1f;color:#e8e8ec;min-height:100vh;padding:20px}
h1{font-size:22px;margin-bottom:6px}
.sub{font-size:13px;color:#8a8a95;margin-bottom:20px}
.layout{display:flex;gap:24px;flex-wrap:wrap;align-items:flex-start}
.sidebar{width:300px;flex-shrink:0}
.sidebar h2{font-size:14px;color:#8a8a95;margin-bottom:10px;font-weight:500}
.card{background:#26262e;border-radius:12px;padding:14px;margin-bottom:14px}
.card label{display:block;font-size:12px;color:#b0b0bc;margin-bottom:6px}
.card input[type=text],.card textarea{width:100%;background:#1a1a1f;border:1px solid #3a3a46;color:#e8e8ec;padding:9px 11px;border-radius:8px;font-size:13px;font-family:inherit;margin-bottom:10px}
.card textarea{resize:vertical;min-height:60px}
.avatar-row{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.avatar-preview{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5);display:grid;place-items:center;color:#fff;font-size:24px;font-weight:600;background-size:cover;background-position:center;flex-shrink:0}
.btn{background:#3a3a46;color:#e8e8ec;border:0;padding:9px 14px;border-radius:8px;font-size:13px;cursor:pointer;font-family:inherit}
.btn:hover{background:#4a4a58}
.btn.primary{background:#e84e8a;color:#fff}
.btn.primary:hover{background:#f0609a}
.btn.block{display:block;width:100%;margin-bottom:8px}
.btn.danger{color:#ff5c7a}
.post-list{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.post-item{display:flex;align-items:center;gap:10px;padding:8px;background:#26262e;border-radius:10px;cursor:grab;border:2px solid transparent;transition:.15s}
.post-item:hover{background:#2e2e38}
.post-item.active{border-color:#e84e8a;background:#2e2e38}
.post-item.dragging{opacity:.4;cursor:grabbing}
.post-item.drag-over{border-color:#e84e8a;transform:scale(1.02)}
.post-item .num{width:24px;height:24px;border-radius:50%;background:#3a3a46;display:grid;place-items:center;font-size:12px;flex-shrink:0}
.post-item .mini{width:44px;height:44px;border-radius:6px;background:#3a3a46 center/cover;flex-shrink:0}
.post-item .info{flex:1;min-width:0}
.post-item .info b{font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.post-item .info small{font-size:10px;color:#8a8a95}
.post-item .del{background:none;border:0;color:#ff5c7a;font-size:16px;cursor:pointer;padding:4px}
.editor-area{flex:1;min-width:320px;max-width:420px}
.preview{background:#000;border-radius:16px;overflow:hidden;aspect-ratio:9/16;display:flex;flex-direction:column;position:relative}
.preview-top{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:#fff;color:#262626;flex-shrink:0}
.preview-top .logo{font-family:Georgia,serif;font-style:italic;font-size:20px;font-weight:600}
.preview-body{flex:1;overflow-y:auto;background:#fff;color:#262626}
.preview-post{background:#fff;border-bottom:1px solid #efefef}
.preview-post .head{display:flex;align-items:center;gap:8px;padding:10px 12px;font-size:12px}
.preview-post .head .av{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5);display:grid;place-items:center;color:#fff;font-size:12px;background-size:cover;background-position:center}
.preview-post img{width:100%;display:block;max-height:300px;object-fit:cover}
.preview-post .cap{padding:8px 12px;font-size:12px;line-height:1.5}
.preview-post .cap b{font-weight:600}
.preview-post .meta{padding:0 12px 10px;font-size:11px;color:#8e8e8e}
.preview-empty{text-align:center;color:#8e8e8e;font-size:13px;padding:40px 20px}
.panel{width:280px;flex-shrink:0}
.panel h3{font-size:14px;color:#8a8a95;margin-bottom:10px;font-weight:500}
.panel .empty{color:#666;font-size:12px;padding:20px 0;text-align:center}
.img-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.img-grid .img-cell{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;background:#1a1a1f}
.img-grid .img-cell img{width:100%;height:100%;object-fit:cover;display:block}
.img-grid .img-cell .rm{position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;background:#000a;color:#fff;border:0;font-size:12px;cursor:pointer;display:grid;place-items:center;padding:0}
.img-grid .img-cell .rm:hover{background:#ff5c7a}
.img-grid .img-cell .idx{position:absolute;bottom:2px;left:2px;background:#000a;color:#fff;font-size:10px;padding:1px 5px;border-radius:4px}
.output{margin-top:24px;background:#26262e;border-radius:14px;padding:16px}
.output h3{font-size:13px;color:#8a8a95;margin-bottom:10px}
.output textarea{width:100%;min-height:120px;background:#1a1a1f;border:1px solid #3a3a46;color:#9ae6b4;padding:12px;border-radius:8px;font-family:ui-monospace,Menlo,monospace;font-size:11px;resize:vertical}
.output .actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#e84e8a;color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;opacity:0;transition:.3s;pointer-events:none;z-index:100}
.toast.show{opacity:1}
</style>
</head>
<body>
<h1>IG 编辑器</h1>
<p class="sub">管理多个账号：每个账号可编辑头像、ID、简介和帖子，拖拽排序，生成数据发给我</p>

<div class="layout">
  <div class="sidebar">
    <h2>账号列表</h2>
    <div class="post-list" id="accountList"></div>
    <button class="btn block" id="addAccount">＋ 添加账号</button>
    <button class="btn block" id="importIndex" title="从 index.html 读取现有账号">⬇ 从 index.html 导入账号</button>
    <button class="btn block" id="importIndexFile" title="直接选择 index.html 文件（双击打开时用这个）">📄 选择 index.html 文件</button>
    <input type="file" id="importIndexFileInput" accept=".html,text/html" style="display:none">
    <button class="btn block" id="importJson" title="导入之前导出的 ig-data.json">📂 导入 ig-data.json</button>
    <input type="file" id="importJsonInput" accept=".json,application/json" style="display:none">

    <h2>账号信息</h2>
    <div class="card">
      <label>头像</label>
      <div class="avatar-row">
        <div class="avatar-preview" id="avatarPreview">我</div>
        <button class="btn" id="pickAvatar">选择头像</button>
        <input type="file" id="avatarInput" accept="image/*" style="display:none">
      </div>
      <label>ID（@后面的名字）</label>
      <input type="text" id="igId" placeholder="my_account">
      <label>昵称</label>
      <input type="text" id="igName" placeholder="我的名字">
      <label>简介</label>
      <textarea id="igBio" placeholder="写点什么…"></textarea>
      <button class="btn block danger" id="deleteAccount">删除这个账号</button>
    </div>

    <h2>帖子列表</h2>
    <div class="post-list" id="postList"></div>
    <button class="btn block" id="addPost">＋ 添加帖子</button>
    <button class="btn block" id="batchImport">📷 批量导入照片</button>
    <input type="file" id="batchInput" accept="image/*" multiple style="display:none">

    <h2>快拍列表</h2>
    <div class="post-list" id="storyList"></div>
    <button class="btn block" id="addStory">＋ 添加快拍</button>
    <button class="btn block" id="batchStory">📷 批量导入快拍</button>
    <input type="file" id="batchStoryInput" accept="image/*" multiple style="display:none">
  </div>

  <div class="editor-area">
    <h2 style="font-size:14px;color:#8a8a95;margin-bottom:10px;font-weight:500">预览</h2>
    <div class="preview">
      <div class="preview-top">
        <span class="logo">Instagram</span>
        <span>♡ ✉</span>
      </div>
      <div class="preview-body" id="previewBody"></div>
    </div>
  </div>

  <div class="panel">
    <h3>快拍设置</h3>
    <div id="storyPanel">
      <div class="empty" id="storyEmpty">选中一条快拍来编辑</div>
      <div id="storyProps" style="display:none">
        <div class="card">
          <label>快拍图片</label>
          <div class="img-grid" id="storyImgGrid"></div>
          <button class="btn block" id="pickStoryImg" style="margin-bottom:10px">＋ 更换图片</button>
          <input type="file" id="storyImgInput" accept="image/*" style="display:none">
          <label>日期（显示在右上角）</label>
          <input type="text" id="storyDate" placeholder="26.09.21">
          <label>时长（秒）</label>
          <input type="text" id="storyDuration" placeholder="5" inputmode="numeric">
          <button class="btn block danger" id="deleteStory">删除这条快拍</button>
        </div>
      </div>
    </div>

    <h3 style="margin-top:22px">帖子设置</h3>
    <div id="postPanel">
      <div class="empty" id="postEmpty">选中一条帖子来编辑</div>
      <div id="postProps" style="display:none">
        <div class="card">
          <label>图片（可多张，左右滑动）</label>
          <div class="img-grid" id="postImgGrid"></div>
          <button class="btn block" id="pickPostImg" style="margin-bottom:10px">＋ 添加图片</button>
          <input type="file" id="postImgInput" accept="image/*" multiple style="display:none">
          <label>文案</label>
          <textarea id="postCaption" placeholder="写点什么…"></textarea>
          <label>点赞数</label>
          <input type="text" id="postLikes" placeholder="128" inputmode="numeric">
          <label>时间</label>
          <input type="text" id="postTime" placeholder="2小时前">
          <button class="btn block danger" id="deletePost">删除这条帖子</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="output">
  <h3>保存数据（复制这段发给我）</h3>
  <textarea id="outputData" readonly placeholder="编辑完成后点「生成数据」"></textarea>
  <div class="actions">
    <button class="btn primary" id="generate">生成数据</button>
    <button class="btn" id="copyBtn">复制</button>
    <button class="btn" id="resetDiff" title="清空对比基准，下次生成全量">↺ 重置对比</button>
    <button class="btn" id="exportFile">💾 导出为文件</button>
    <button class="btn primary" id="downloadBtn" style="background:#2e9e5b">⬇ 下载图片</button>
  </div>
  <div id="outputInfo" style="font-size:11px;color:#8a8a95;margin-top:8px;line-height:1.6"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);

// ===== 数据 =====
const STORAGE_KEY = 'ig-editor-data-v2';
const LAST_KEY = 'ig-editor-last-generated-v2';

// accounts: [{profile:{avatar,avatarFile,id,name,bio}, posts:[{images:[{src,fileName}],caption,likes,time}]}]
let accounts = [];
let accountIndex = 0;
let currentIndex = -1;

function newAccount(){
  return { profile: { avatar: '', avatarFile: '', id: '', name: '', bio: '' }, posts: [], stories: [] };
}
function acc(){ return accounts[accountIndex] || accounts[0]; }
function profile(){ return acc().profile; }
function posts(){ return acc().posts; }
function stories(){ if(!Array.isArray(acc().stories)) acc().stories=[]; return acc().stories; }
let currentStoryIndex = -1;

function saveLocal() {
  try {
    const meta = {
      accounts: accounts.map(a => ({
        profile: { avatarFile: a.profile.avatarFile, id: a.profile.id, name: a.profile.name, bio: a.profile.bio },
        posts: (a.posts||[]).map(p => ({ images: (p.images||[]).map(im => ({ fileName: im.fileName || '' })), caption: p.caption || '', likes: p.likes || '', time: p.time || '' })),
        stories: (a.stories||[]).map(st => ({ fileName: st.fileName || '', date: st.date || '', duration: st.duration || 5 }))
      })),
      accountIndex
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(meta));
  } catch (e) {}
}

function loadLocal() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) { accounts = [newAccount()]; return; }
    const meta = JSON.parse(raw);
    if (!Array.isArray(meta.accounts) || !meta.accounts.length) { accounts = [newAccount()]; return; }
    accounts = meta.accounts.map(a => {
      const p = a.profile || {};
      const prof = {
        avatar: p.avatarFile ? ('ig/' + p.avatarFile) : '',
        avatarFile: p.avatarFile || '',
        id: p.id || '', name: p.name || '', bio: p.bio || ''
      };
      const ps = (a.posts || []).map(m => {
        let imgs = [];
        if (Array.isArray(m.images)) {
          imgs = m.images.map(im => ({ src: im.fileName ? ('ig/' + im.fileName) : '', fileName: im.fileName || '' }));
        } else if (m.fileName) {
          imgs = [{ src: 'ig/' + m.fileName, fileName: m.fileName }];
        }
        return { images: imgs, caption: m.caption || '', likes: m.likes || '', time: m.time || '' };
      });
      const sts = (a.stories || []).map(m => ({
        src: m.fileName ? ('ig/' + m.fileName) : '',
        fileName: m.fileName || '',
        date: m.date || '',
        duration: m.duration || 5
      }));
      return { profile: prof, posts: ps, stories: sts };
    });
    accountIndex = Math.min(Math.max(0, meta.accountIndex || 0), accounts.length - 1);
  } catch (e) { accounts = [newAccount()]; }
}

// ===== 从外部数据导入账号 =====
// 把 {accounts:[{profile,posts,stories}]} 转成编辑器内部结构
function importAccountsData(data, mode) {
  if (!data || !Array.isArray(data.accounts) || !data.accounts.length) {
    toast('数据里没有账号');
    return false;
  }
  const converted = data.accounts.map(a => {
    const p = a.profile || {};
    // avatar 形如 "ig/IMG_7384.JPG" -> 文件名 "IMG_7384.JPG"
    const avatarFile = p.avatar ? p.avatar.replace(/^.*\//, '') : '';
    const prof = {
      avatar: p.avatar || '',
      avatarFile: avatarFile,
      id: p.id || '', name: p.name || '', bio: p.bio || ''
    };
    const ps = (a.posts || []).map(post => ({
      images: (post.images || []).filter(Boolean).map(src => ({
        src: src,
        fileName: src.replace(/^.*\//, '')
      })),
      caption: post.caption || '',
      likes: post.likes || '',
      time: post.time || ''
    }));
    const sts = (a.stories || []).map(st => ({
      src: st.src || '',
      fileName: st.src ? st.src.replace(/^.*\//, '') : '',
      date: st.date || '',
      duration: st.duration || 5
    }));
    return { profile: prof, posts: ps, stories: sts };
  });

  if (mode === 'replace') {
    accounts = converted;
    accountIndex = 0;
  } else {
    // 合并：按 id 去重，已存在的跳过
    const existing = new Set(accounts.map(a => (a.profile || {}).id));
    converted.forEach(a => {
      if (!existing.has(a.profile.id)) accounts.push(a);
    });
  }
  currentIndex = -1;
  currentStoryIndex = -1;
  saveLocal();
  renderAll();
  return true;
}

// 从源码里提取 `const NAME=...;` 的对象字面量（括号配平，兼容单行/多行）
function extractConst(src, name) {
  const key = 'const ' + name + '=';
  const start = src.indexOf(key);
  if (start < 0) return null;
  let i = start + key.length;
  // 跳过空白
  while (i < src.length && /\s/.test(src[i])) i++;
  if (src[i] !== '{') return null;
  let depth = 0, inStr = null, esc = false;
  const begin = i;
  for (; i < src.length; i++) {
    const c = src[i];
    if (inStr) {
      if (esc) { esc = false; continue; }
      if (c === '\\') { esc = true; continue; }
      if (c === inStr) inStr = null;
      continue;
    }
    if (c === '"' || c === "'" || c === '`') { inStr = c; continue; }
    if (c === '{') depth++;
    else if (c === '}') { depth--; if (depth === 0) { i++; break; } }
  }
  return src.slice(begin, i);
}

// 解析 index.html 文本，返回 {accounts:[...]}（含快拍）
function parseIndexHtml(html) {
  const src = extractConst(html, 'igData');
  if (!src) throw new Error('index.html 里没找到 igData');
  const data = new Function('return (' + src + ')')();

  // 快拍数据在 storiesByAccount 里，不在 igData 里，需要单独读
  const ssrc = extractConst(html, 'storiesByAccount');
  if (ssrc) {
    try {
      const byAcc = new Function('return (' + ssrc + ')')();
      data.accounts.forEach(a => {
        const id = (a.profile || {}).id;
        if (id && Array.isArray(byAcc[id]) && byAcc[id].length) {
          a.stories = byAcc[id];
        }
      });
    } catch (e) { console.warn('storiesByAccount 解析失败', e); }
  }
  return data;
}

// 从 index.html 读取 igData（fetch 方式）
async function importFromIndex() {
  try {
    const res = await fetch('index.html', { cache: 'no-store' });
    if (!res.ok) throw new Error('读取失败');
    const html = await res.text();
    const data = parseIndexHtml(html);
    if (importAccountsData(data, 'replace')) {
      const total = data.accounts.reduce((n, a) => n + (a.stories || []).length, 0);
      toast('已从 index.html 导入 ' + data.accounts.length + ' 个账号 / ' + total + ' 条快拍');
    }
  } catch (e) {
    toast('自动读取失败（双击打开时浏览器会拦截），请点「📄 选择 index.html 文件」');
  }
}

// ===== 渲染 =====
function renderAccountList() {
  const list = $('#accountList');
  list.innerHTML = accounts.map((a, i) => {
    const p = a.profile || {};
    const av = p.avatar ? 'background-image:url(' + p.avatar + ')' : '';
    return `
    <div class="post-item ${i===accountIndex?'active':''}" data-acc="${i}">
      <span class="mini" style="border-radius:50%;${av}"></span>
      <div class="info">
        <b>${p.id || '（未命名账号）'}</b>
        <small>${p.name || ''} · ${(a.posts||[]).length} 条帖子</small>
      </div>
      ${accounts.length>1?`<button class="del" data-delacc="${i}" title="删除账号">✕</button>`:''}
    </div>`;
  }).join('');
  $$('[data-acc]').forEach(el => {
    el.onclick = e => {
      if (e.target.dataset.delacc !== undefined) return;
      switchAccount(+el.dataset.acc);
    };
  });
  $$('[data-delacc]').forEach(b => {
    b.onclick = e => {
      e.stopPropagation();
      const i = +b.dataset.delacc;
      if (!confirm('删除账号 @' + ((accounts[i].profile||{}).id || '') + ' 及其所有帖子？')) return;
      accounts.splice(i, 1);
      if (accountIndex >= accounts.length) accountIndex = accounts.length - 1;
      currentIndex = -1;
      currentStoryIndex = -1;
      saveLocal(); renderAll();
    };
  });
}

function switchAccount(i) {
  if (i < 0 || i >= accounts.length) return;
  accountIndex = i;
  currentIndex = -1;
  currentStoryIndex = -1;
  saveLocal(); renderAll();
}

function renderProfileFields() {
  const p = profile();
  $('#igId').value = p.id || '';
  $('#igName').value = p.name || '';
  $('#igBio').value = p.bio || '';
  const av = $('#avatarPreview');
  if (p.avatar) {
    av.style.backgroundImage = 'url(' + p.avatar + ')';
    av.textContent = '';
  } else {
    av.style.backgroundImage = '';
    av.textContent = '我';
  }
}

function renderList() {
  const list = $('#postList');
  const ps = posts();
  if (ps.length === 0) {
    list.innerHTML = '<div style="color:#666;font-size:12px;padding:10px">还没有帖子，点下面添加</div>';
    return;
  }
  list.innerHTML = ps.map((p, i) => `
    <div class="post-item ${i===currentIndex?'active':''}" data-idx="${i}" draggable="true">
      <span class="num">${i+1}</span>
      <div class="mini" style="background-image:url('${(p.images&&p.images[0]&&p.images[0].src)||''}')"></div>
      <div class="info">
        <b>${(p.caption||'（无文案）').slice(0,16)}</b>
        <small>${(p.images||[]).length} 张 · ${p.likes||0} 赞 · ${p.time||''}</small>
      </div>
      <button class="del" data-del="${i}" title="删除">✕</button>
    </div>
  `).join('');
  // 注意：只绑定 #postList 内的项，避免覆盖账号列表的点击事件
  $$('#postList .post-item').forEach(el => {
    el.onclick = e => {
      if (e.target.dataset.del !== undefined) return;
      selectPost(+el.dataset.idx);
    };
  });
  $$('#postList [data-del]').forEach(b => {
    b.onclick = e => {
      e.stopPropagation();
      const idx = +b.dataset.del;
      posts().splice(idx, 1);
      if (currentIndex >= posts().length) currentIndex = posts().length - 1;
      saveLocal(); renderList(); renderPreview(); updatePanel();
    };
  });
  // 拖拽排序（只针对 #postList 内的项）
  let dragIdx = -1;
  $$('#postList .post-item').forEach(el => {
    el.addEventListener('dragstart', e => {
      dragIdx = +el.dataset.idx;
      el.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    });
    el.addEventListener('dragend', () => {
      el.classList.remove('dragging');
      $$('#postList .post-item').forEach(x => x.classList.remove('drag-over'));
    });
    el.addEventListener('dragover', e => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      el.classList.add('drag-over');
    });
    el.addEventListener('dragleave', () => el.classList.remove('drag-over'));
    el.addEventListener('drop', e => {
      e.preventDefault();
      el.classList.remove('drag-over');
      const to = +el.dataset.idx;
      if (dragIdx < 0 || dragIdx === to) return;
      const ps = posts();
      const [moved] = ps.splice(dragIdx, 1);
      ps.splice(to, 0, moved);
      if (currentIndex === dragIdx) currentIndex = to;
      else if (dragIdx < currentIndex && to >= currentIndex) currentIndex--;
      else if (dragIdx > currentIndex && to <= currentIndex) currentIndex++;
      dragIdx = -1;
      saveLocal(); renderList(); renderPreview();
    });
  });
}

function renderPreview() {
  const body = $('#previewBody');
  const ps = posts();
  const prof = profile();
  if (ps.length === 0) {
    body.innerHTML = '<div class="preview-empty">还没有帖子</div>';
    return;
  }
  const avStyle = prof.avatar ? 'background-image:url(' + prof.avatar + ')' : '';
  const avText = prof.avatar ? '' : '我';
  body.innerHTML = ps.map(p => {
    const imgs = p.images || [];
    let imgHtml;
    if (imgs.length === 0) {
      imgHtml = '<div style="aspect-ratio:1;background:#efefef;display:grid;place-items:center;color:#bbb;font-size:12px">暂无图片</div>';
    } else if (imgs.length === 1) {
      imgHtml = '<img src="' + imgs[0].src + '" alt="">';
    } else {
      // 多图：横向滑动轮播
      const slides = imgs.map(im => '<img src="' + im.src + '" alt="" style="flex:0 0 100%;width:100%;object-fit:cover;max-height:300px">').join('');
      const dots = imgs.map((_,i) => '<span style="width:6px;height:6px;border-radius:50%;background:' + (i===0?'#3897f0':'#c7c7c7') + ';display:inline-block;margin:0 2px"></span>').join('');
      imgHtml = '<div style="position:relative">'
        + '<div style="display:flex;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch">' + slides + '</div>'
        + '<div style="position:absolute;bottom:8px;left:0;right:0;text-align:center">' + dots + '</div>'
        + '<div style="position:absolute;top:8px;right:8px;background:#000a;color:#fff;font-size:10px;padding:2px 7px;border-radius:10px">1/' + imgs.length + '</div>'
        + '</div>';
    }
    return '<div class="preview-post">'
      + '<div class="head"><span class="av" style="' + avStyle + '">' + avText + '</span><b>' + (profile().id || '我的账号') + '</b></div>'
      + imgHtml
      + '<div class="cap"><b>' + (p.likes || 0) + ' 次赞</b></div>'
      + '<div class="cap"><b>' + (profile().id || '我的账号') + '</b> ' + (p.caption || '') + '</div>'
      + '<div class="meta">' + (p.time || '') + '</div>'
      + '</div>';
  }).join('');
}

// ===== 快拍 =====
function renderStoryList(){
  const list=$('#storyList');
  const sts=stories();
  if(sts.length===0){
    list.innerHTML='<div style="color:#666;font-size:12px;padding:10px">这个账号还没有快拍</div>';
    return;
  }
  list.innerHTML=sts.map((st,i)=>`
    <div class="post-item ${i===currentStoryIndex?'active':''}" data-sidx="${i}" draggable="true">
      <span class="num">${i+1}</span>
      <div class="mini" style="background-image:url('${st.src||''}')"></div>
      <div class="info">
        <b>${st.date||'（无日期）'}</b>
        <small>${st.duration||5} 秒</small>
      </div>
      <button class="del" data-delstory="${i}" title="删除">✕</button>
    </div>
  `).join('');
  $$('[data-sidx]').forEach(el=>{
    el.onclick=e=>{
      if(e.target.dataset.delstory!==undefined)return;
      selectStory(+el.dataset.sidx);
    };
  });
  $$('[data-delstory]').forEach(b=>{
    b.onclick=e=>{
      e.stopPropagation();
      const idx=+b.dataset.delstory;
      stories().splice(idx,1);
      if(currentStoryIndex>=stories().length) currentStoryIndex=stories().length-1;
      saveLocal(); renderStoryList(); updateStoryPanel();
    };
  });
  // 拖拽排序
  let dragIdx=-1;
  $$('[data-sidx]').forEach(el=>{
    el.addEventListener('dragstart',e=>{ dragIdx=+el.dataset.sidx; el.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; });
    el.addEventListener('dragend',()=>{ el.classList.remove('dragging'); $$('[data-sidx]').forEach(x=>x.classList.remove('drag-over')); });
    el.addEventListener('dragover',e=>{ e.preventDefault(); el.classList.add('drag-over'); });
    el.addEventListener('dragleave',()=>el.classList.remove('drag-over'));
    el.addEventListener('drop',e=>{
      e.preventDefault(); el.classList.remove('drag-over');
      const to=+el.dataset.sidx;
      if(dragIdx<0||dragIdx===to)return;
      const sts=stories();
      const [moved]=sts.splice(dragIdx,1);
      sts.splice(to,0,moved);
      if(currentStoryIndex===dragIdx) currentStoryIndex=to;
      else if(dragIdx<currentStoryIndex&&to>=currentStoryIndex) currentStoryIndex--;
      else if(dragIdx>currentStoryIndex&&to<=currentStoryIndex) currentStoryIndex++;
      dragIdx=-1;
      saveLocal(); renderStoryList();
    });
  });
}

function selectStory(i){
  currentStoryIndex=i;
  renderStoryList();
  updateStoryPanel();
}

function updateStoryPanel(){
  const empty=$('#storyEmpty'), props=$('#storyProps');
  if(currentStoryIndex<0||!stories()[currentStoryIndex]){
    empty.style.display='block'; props.style.display='none'; return;
  }
  empty.style.display='none'; props.style.display='block';
  const st=stories()[currentStoryIndex];
  const grid=$('#storyImgGrid');
  grid.innerHTML=st.src?`<div class="img-cell"><img src="${st.src}" alt=""><span class="idx">1</span></div>`
    :'<div style="grid-column:1/-1;color:#666;font-size:12px;padding:8px 0">还没有图片</div>';
  $('#storyDate').value=st.date||'';
  $('#storyDuration').value=st.duration||5;
}

$('#addStory').onclick=()=>{
  stories().push({ src:'', fileName:'', date:'', duration:5 });
  selectStory(stories().length-1);
  saveLocal(); renderStoryList();
};

$('#pickStoryImg').onclick=()=>$('#storyImgInput').click();
$('#storyImgInput').onchange=async e=>{
  if(currentStoryIndex<0){ e.target.value=''; return; }
  const file=e.target.files[0];
  e.target.value='';
  if(!file)return;
  try{
    const dataUrl=await readAsDataURL(file);
    let src=dataUrl, fileName=file.name;
    if(/\.(heic|heif)$/i.test(file.name)){
      const jpg=await heicToJpg(dataUrl,file.name);
      if(jpg){ src=jpg.dataUrl; fileName=jpg.fileName; }
    }
    const st=stories()[currentStoryIndex];
    st.src=src; st.fileName=fileName;
    saveLocal(); renderStoryList(); updateStoryPanel();
    toast('快拍图片已更新');
  }catch(err){ toast('图片读取失败'); }
};

$('#storyDate').oninput=e=>{ if(currentStoryIndex<0)return; stories()[currentStoryIndex].date=e.target.value; saveLocal(); renderStoryList(); };
$('#storyDuration').oninput=e=>{ if(currentStoryIndex<0)return; stories()[currentStoryIndex].duration=+e.target.value||5; saveLocal(); renderStoryList(); };
$('#deleteStory').onclick=()=>{
  if(currentStoryIndex<0)return;
  stories().splice(currentStoryIndex,1);
  if(currentStoryIndex>=stories().length) currentStoryIndex=stories().length-1;
  saveLocal(); renderStoryList(); updateStoryPanel();
};

// 批量导入快拍：每张图一条快拍
$('#batchStory').onclick=()=>$('#batchStoryInput').click();
$('#batchStoryInput').onchange=async e=>{
  const files=[...e.target.files].filter(f=>f.type.startsWith('image/')||/\.(heic|heif)$/i.test(f.name));
  e.target.value='';
  if(!files.length){ toast('没有选择图片'); return; }
  toast('正在导入 '+files.length+' 条快拍…');
  for(const file of files){
    try{
      const dataUrl=await readAsDataURL(file);
      let src=dataUrl, fileName=file.name;
      if(/\.(heic|heif)$/i.test(file.name)){
        const jpg=await heicToJpg(dataUrl,file.name);
        if(jpg){ src=jpg.dataUrl; fileName=jpg.fileName; }
      }
      stories().push({ src, fileName, date:'', duration:5 });
    }catch(err){ console.warn('导入失败:',file.name,err); }
  }
  currentStoryIndex=stories().length-1;
  saveLocal(); renderStoryList(); updateStoryPanel();
  toast('已添加 '+files.length+' 条快拍');
};

function selectPost(i) {
  currentIndex = i;
  renderList();
  updatePanel();
}

function updatePanel() {
  const empty = $('#postEmpty');
  const props = $('#postProps');
  if (currentIndex < 0 || !posts()[currentIndex]) {
    empty.style.display = 'block';
    props.style.display = 'none';
    return;
  }
  empty.style.display = 'none';
  props.style.display = 'block';
  const p = posts()[currentIndex];
  // 多图网格
  const grid = $('#postImgGrid');
  const imgs = p.images || [];
  if (imgs.length === 0) {
    grid.innerHTML = '<div style="grid-column:1/-1;color:#666;font-size:12px;padding:8px 0">还没有图片</div>';
  } else {
    grid.innerHTML = imgs.map((im, i) => `
      <div class="img-cell">
        <img src="${im.src}" alt="">
        <button class="rm" data-rm="${i}" title="移除">✕</button>
        <span class="idx">${i+1}</span>
      </div>
    `).join('');
    $$('[data-rm]').forEach(b => {
      b.onclick = () => {
        const idx = +b.dataset.rm;
        posts()[currentIndex].images.splice(idx, 1);
        saveLocal(); renderList(); renderPreview(); updatePanel();
      };
    });
  }
  $('#postCaption').value = p.caption || '';
  $('#postLikes').value = p.likes || '';
  $('#postTime').value = p.time || '';

// ===== 事件 =====
$('#igId').oninput = e => { profile().id = e.target.value; saveLocal(); renderAccountList(); renderPreview(); };
$('#igName').oninput = e => { profile().name = e.target.value; saveLocal(); renderAccountList(); };
$('#igBio').oninput = e => { profile().bio = e.target.value; saveLocal(); };

$('#pickAvatar').onclick = () => $('#avatarInput').click();
$('#avatarInput').onchange = e => {
  const f = e.target.files[0];
  if (!f) return;
  const reader = new FileReader();
  reader.onload = ev => {
    profile().avatar = ev.target.result;
    profile().avatarFile = f.name;
    saveLocal(); renderProfileFields(); renderAccountList(); renderPreview();
    toast('头像已加载');
  };
  reader.readAsDataURL(f);
  e.target.value = '';
};

$('#addPost').onclick = () => {
  posts().push({ images: [], caption: '', likes: '', time: '' });
  selectPost(posts().length - 1);
  saveLocal(); renderList(); renderPreview();
};

$('#pickPostImg').onclick = () => $('#postImgInput').click();
$('#postImgInput').onchange = async e => {
  if (currentIndex < 0) { e.target.value = ''; return; }
  const files = [...e.target.files].filter(f => f.type.startsWith('image/') || /\.(heic|heif)$/i.test(f.name));
  e.target.value = '';
  if (!files.length) return;
  toast('正在添加 ' + files.length + ' 张…');
  if (!Array.isArray(posts()[currentIndex].images)) posts()[currentIndex].images = [];
  for (const file of files) {
    try {
      const dataUrl = await readAsDataURL(file);
      let src = dataUrl, fileName = file.name;
      if (/\.(heic|heif)$/i.test(file.name)) {
        const jpg = await heicToJpg(dataUrl, file.name);
        if (jpg) { src = jpg.dataUrl; fileName = jpg.fileName; }
      }
      posts()[currentIndex].images.push({ src, fileName });
    } catch (err) { console.warn('添加失败:', file.name, err); }
  }
  saveLocal(); renderList(); renderPreview(); updatePanel();
  toast('已添加 ' + files.length + ' 张');
};

$('#postCaption').oninput = e => { if (currentIndex < 0) return; posts()[currentIndex].caption = e.target.value; saveLocal(); renderList(); renderPreview(); };
$('#postLikes').oninput = e => { if (currentIndex < 0) return; posts()[currentIndex].likes = e.target.value; saveLocal(); renderList(); renderPreview(); };
$('#postTime').oninput = e => { if (currentIndex < 0) return; posts()[currentIndex].time = e.target.value; saveLocal(); renderList(); renderPreview(); };

$('#deletePost').onclick = () => {
  if (currentIndex < 0) return;
  posts().splice(currentIndex, 1);
  if (currentIndex >= posts().length) currentIndex = posts().length - 1;
  saveLocal(); renderList(); renderPreview(); updatePanel();
};

// 批量导入：一次选多张 → 全部放进同一个新帖子（轮播）
$('#batchImport').onclick = () => $('#batchInput').click();
$('#batchInput').onchange = async e => {
  const files = [...e.target.files].filter(f => f.type.startsWith('image/') || /\.(heic|heif)$/i.test(f.name));
  e.target.value = '';
  if (!files.length) { toast('没有选择图片'); return; }
  toast('正在导入 ' + files.length + ' 张到同一个帖子…');
  const newPost = { images: [], caption: '', likes: '', time: '' };
  for (const file of files) {
    try {
      const dataUrl = await readAsDataURL(file);
      let src = dataUrl, fileName = file.name;
      if (/\.(heic|heif)$/i.test(file.name)) {
        const jpg = await heicToJpg(dataUrl, file.name);
        if (jpg) { src = jpg.dataUrl; fileName = jpg.fileName; }
      }
      newPost.images.push({ src, fileName });
    } catch (err) { console.warn('导入失败:', file.name, err); }
  }
  if (newPost.images.length) {
    posts().push(newPost);
    currentIndex = posts().length - 1;
    saveLocal(); renderList(); renderPreview(); updatePanel();
    toast('已创建 1 条帖子，含 ' + newPost.images.length + ' 张图');
    // 自动下载图片，方便放进 ig/ 文件夹
    newPost.images.forEach(im => {
      const a = document.createElement('a');
      a.href = im.src;
      a.download = im.fileName || 'image.jpg';
      a.click();
    });
  } else toast('导入失败');
};

function readAsDataURL(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = ev => resolve(ev.target.result);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}
function heicToJpg(dataUrl, originalName) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      try {
        const canvas = document.createElement('canvas');
        canvas.width = img.naturalWidth;
        canvas.height = img.naturalHeight;
        canvas.getContext('2d').drawImage(img, 0, 0);
        resolve({ dataUrl: canvas.toDataURL('image/jpeg', 0.9), fileName: originalName.replace(/\.(heic|heif)$/i, '.jpg') });
      } catch (e) { resolve(null); }
    };
    img.onerror = () => resolve(null);
    img.src = dataUrl;
  });
}

// ===== 生成数据 =====
function buildData() {
  return {
    accounts: accounts.map(a => ({
      profile: {
        avatar: a.profile.avatarFile ? ('ig/' + a.profile.avatarFile) : '',
        id: a.profile.id || '',
        name: a.profile.name || '',
        bio: a.profile.bio || ''
      },
      posts: (a.posts || []).map(p => ({
        images: (p.images || []).map(im => im.fileName ? ('ig/' + im.fileName) : '').filter(Boolean),
        caption: p.caption || '',
        likes: p.likes || '',
        time: p.time || ''
      })),
      stories: (a.stories || []).map(st => ({
        src: st.fileName ? ('ig/' + st.fileName) : '',
        date: st.date || '',
        duration: st.duration || 5
      }))
    }))
  };
}

function totalPosts(d) {
  return (d.accounts || []).reduce((n, a) => n + (a.posts || []).length, 0);
}
function totalStories(d) {
  return (d.accounts || []).reduce((n, a) => n + (a.stories || []).length, 0);
}

function dataSig(d) {
  return JSON.stringify(d);
}

$('#generate').onclick = () => {
  const current = buildData();
  const info = $('#outputInfo');
  let last = null;
  try { last = JSON.parse(localStorage.getItem(LAST_KEY) || 'null'); } catch {}

  if (!last) {
    const json = JSON.stringify(current);
    $('#outputData').value = json;
    info.innerHTML = '✅ 首次生成，全量数据（' + current.accounts.length + ' 个账号，' + totalPosts(current) + ' 条帖子，' + totalStories(current) + ' 条快拍）';
    localStorage.setItem(LAST_KEY, JSON.stringify(current));
    toast('首次生成全量数据');
    return;
  }
  if (dataSig(last) === dataSig(current)) {
    $('#outputData').value = '';
    info.innerHTML = '✅ 没有变化，无需发送';
    toast('没有变化');
    return;
  }
  const json = JSON.stringify(current);
  $('#outputData').value = json;
  info.innerHTML = '✅ 数据有变化，已生成（' + current.accounts.length + ' 个账号，' + totalPosts(current) + ' 条帖子，' + totalStories(current) + ' 条快拍）';
  localStorage.setItem(LAST_KEY, JSON.stringify(current));
  toast('已生成数据');
};

$('#resetDiff').onclick = () => { localStorage.removeItem(LAST_KEY); toast('已重置，下次生成全量'); };

$('#copyBtn').onclick = () => {
  const ta = $('#outputData');
  if (!ta.value) { toast('先点生成数据'); return; }
  ta.select();
  document.execCommand('copy');
  toast('已复制');
};

$('#exportFile').onclick = () => {
  const json = JSON.stringify(buildData(), null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'ig-data.json';
  a.click();
  URL.revokeObjectURL(a.href);
  toast('已导出 ig-data.json');
};

$('#downloadBtn').onclick = () => {
  const imgs = [];
  accounts.forEach(a => {
    if (a.profile.avatar) imgs.push({ src: a.profile.avatar, fileName: a.profile.avatarFile || 'avatar.jpg' });
    (a.posts || []).forEach(p => (p.images || []).forEach(im => { if (im.src) imgs.push(im); }));
    (a.stories || []).forEach(st => { if (st.src) imgs.push({ src: st.src, fileName: st.fileName || 'story.jpg' }); });
  });
  if (imgs.length === 0) { toast('还没有图片'); return; }
  imgs.forEach(p => {
    const a = document.createElement('a');
    a.href = p.src;
    a.download = p.fileName || 'image.jpg';
    a.click();
  });
  toast('已下载 ' + imgs.length + ' 张图片');
};

function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 1800);
}

// ===== 初始化 =====
function renderAll() {
  renderAccountList();
  renderProfileFields();
  renderList();
  renderStoryList();
  renderPreview();
  updatePanel();
  updateStoryPanel();
}

// 从 index.html 导入（fetch）
$('#importIndex').onclick = () => {
  if (accounts.length && !confirm('导入会替换当前编辑器里的所有账号，继续？')) return;
  importFromIndex();
};

// 从 index.html 导入（手动选文件，双击打开时用）
$('#importIndexFile').onclick = () => $('#importIndexFileInput').click();
$('#importIndexFileInput').onchange = async e => {
  const f = e.target.files[0];
  e.target.value = '';
  if (!f) return;
  try {
    const html = await f.text();
    const data = parseIndexHtml(html);
    if (accounts.length && !confirm('导入会替换当前编辑器里的所有账号，继续？')) return;
    if (importAccountsData(data, 'replace')) {
      const total = data.accounts.reduce((n, a) => n + (a.stories || []).length, 0);
      toast('已导入 ' + data.accounts.length + ' 个账号 / ' + total + ' 条快拍');
    }
  } catch (err) {
    toast('解析失败：' + err.message);
  }
};

// 从 ig-data.json 文件导入
$('#importJson').onclick = () => $('#importJsonInput').click();
$('#importJsonInput').onchange = async e => {
  const f = e.target.files[0];
  e.target.value = '';
  if (!f) return;
  try {
    const text = await f.text();
    const data = JSON.parse(text);
    // 兼容旧版单账号格式 {profile,posts}
    const normalized = data.accounts ? data : { accounts: [data] };
    if (accounts.length && !confirm('导入会替换当前编辑器里的所有账号，继续？')) return;
    if (importAccountsData(normalized, 'replace')) {
      toast('已导入 ' + normalized.accounts.length + ' 个账号');
    }
  } catch (err) {
    toast('JSON 解析失败：' + err.message);
  }
};

// 添加账号
$('#addAccount').onclick = () => {
  accounts.push(newAccount());
  accountIndex = accounts.length - 1;
  currentIndex = -1;
  currentStoryIndex = -1;
  saveLocal(); renderAll();
  toast('已添加新账号');
};
// 删除当前账号
$('#deleteAccount').onclick = () => {
  if (accounts.length <= 1) { toast('至少保留一个账号'); return; }
  if (!confirm('删除账号 @' + (profile().id || '') + ' 及其所有帖子？')) return;
  accounts.splice(accountIndex, 1);
  if (accountIndex >= accounts.length) accountIndex = accounts.length - 1;
  currentIndex = -1;
  currentStoryIndex = -1;
  saveLocal(); renderAll();
  toast('已删除账号');
};

loadLocal();
renderAll();
// 显式从手机网页载入现有内容；普通打开仍保留本地草稿。
if (new URLSearchParams(location.search).get('source') === 'index') {
  importFromIndex().then(() => {
    history.replaceState(null, '', location.pathname);
  });
}
