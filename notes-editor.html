<!doctype html><meta charset="utf-8"><title>本地备忘录编辑器</title><style>body{font:15px system-ui;background:#f8f5e9;max-width:950px;margin:30px auto;padding:20px}article{background:white;padding:20px;margin:16px 0;border-radius:15px}input,textarea,button{font:inherit;padding:10px;margin:5px;border:1px solid #ddd;border-radius:8px}textarea{display:block;width:95%;min-height:180px}button{cursor:pointer;background:#f1dea0}</style><h1>备忘录编辑器</h1><button id="add">添加备忘录</button><button id="load">载入网页备忘录</button><button id="export">导出数据</button><input type="file" id="import" accept="application/json"><p id="status"></p><main></main><script>
let notes=[];const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function sortNotes(){notes.sort((a,b)=>String(b.date||'').replace(/\D/g,'').slice(0,12).padEnd(12,'0').localeCompare(String(a.date||'').replace(/\D/g,'').slice(0,12).padEnd(12,'0')))}
function save(){try{localStorage.setItem('notes-editor-draft',JSON.stringify(notes));$('#status').textContent='草稿已保存'}catch{$('#status').textContent='保存失败，请导出备份'}}async function load(){const s=await(await fetch('notes-settings.js',{cache:'no-store'})).text();notes=JSON.parse(s.slice(s.indexOf('const NOTES_DEFAULT=')+'const NOTES_DEFAULT='.length,s.indexOf(';'))).notes;save();render()}
function render(){sortNotes();$('main').replaceChildren();notes.forEach((n,i)=>{const row=document.createElement('article');row.innerHTML='<input data-key="title" placeholder="标题" value="'+esc(n.title)+'"><input data-key="date" placeholder="日期" value="'+esc(n.date)+'"><textarea data-key="content" placeholder="备忘录内容">'+esc(n.content)+'</textarea><button data-action="up">上移</button><button data-action="down">下移</button><button data-action="delete">删除</button>';row.querySelectorAll('[data-key]').forEach(input=>{input.oninput=()=>{n[input.dataset.key]=input.value;save()};if(input.dataset.key==='date')input.onchange=()=>{sortNotes();save();render()}});row.querySelectorAll('[data-action]').forEach(button=>button.onclick=()=>{const a=button.dataset.action;if(a==='delete')notes.splice(i,1);else{const to=i+(a==='up'?-1:1);if(to<0||to>=notes.length)return;[notes[i],notes[to]]=[notes[to],notes[i]]}save();render()});$('main').append(row)})}$('#add').onclick=()=>{notes.push({id:'note'+Date.now(),title:'',content:'',date:''});save();render()};$('#load').onclick=()=>{if(confirm('替换当前草稿？'))load().catch(e=>$('#status').textContent=e.message)};$('#export').onclick=()=>{sortNotes();const a=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify({notes},null,2)],{type:'application/json'}));a.href=url;a.download='notes-data.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('#import').onchange=async e=>{try{const d=JSON.parse(await e.target.files[0].text());if(!Array.isArray(d.notes))throw Error('格式不正确');notes=d.notes;save();render()}catch(e){$('#status').textContent=e.message}};try{notes=JSON.parse(localStorage.getItem('notes-editor-draft'))||[]}catch{}if(notes.length)render();else load().catch(e=>$('#status').textContent=e.message);
</script>
