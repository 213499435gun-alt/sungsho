.settings-icon{background:linear-gradient(160deg,#c7ccd4,#8e96a3)}.social-head{display:flex;align-items:center;justify-content:space-between;margin:22px 0;font-size:26px;font-weight:650}.stories{display:flex;gap:15px;overflow:auto;padding:3px 0 18px}.story{background:none;padding:0;font-size:10px;color:#333}.avatar{display:grid;place-items:center;width:48px;height:48px;border-radius:50%;background:#d6c8e6;color:#56465f;font-size:21px;margin-bottom:6px}.story .avatar{outline:2px solid #e84e8a;outline-offset:3px;border:3px solid white}.post{margin:10px -20px 22px;background:white}.post-head{padding:12px 15px;display:flex;align-items:center;gap:10px;font-size:12px}.post-head .avatar{width:30px;height:30px;margin:0;font-size:15px}.post img{width:100%;height:260px;object-fit:cover;display:block}.post-actions{padding:10px 14px;display:flex;gap:16px}.post-actions button{background:none;font-size:25px;padding:0}.post p{font-size:12px;margin:0;padding:0 15px 12px;line-height:1.7}.liked{color:#eb3861}.chat-list button{background:none;display:flex;align-items:center;gap:13px;width:100%;text-align:left;padding:15px 0;color:#222}.chat-list .avatar{margin:0;border-radius:18px;background:#e3d9ec}.chat-info{flex:1}.chat-info b{font-size:14px}.chat-info small{display:block;color:#777;font-size:12px;margin-top:5px}.chat-list time{font-size:10px;color:#999}.conversation{position:absolute;inset:43px 0 25px;display:flex;flex-direction:column;background:#bdd0dd}.chat-header{padding:18px;display:flex;gap:20px;align-items:center;font-size:15px}.chat-header button{font-size:25px;background:none}.messages{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:12px}.bubble{padding:11px 13px;border-radius:4px 14px 14px;background:white;color:#333;max-width:82%;align-self:flex-start;font-size:13px;line-height:1.6;overflow-wrap:anywhere}.bubble.mine{background:#fee500;align-self:flex-end;border-radius:14px 4px 14px 14px}.composer{display:flex;gap:8px;padding:10px;background:#fff}.composer input{width:0;flex:1;border:1px solid #ddd;border-radius:20px;padding:10px}.composer button{background:#fee500;border-radius:12px;padding:8px 13px}.social-note{font-size:10px;color:#999}.phone .lock-side{top:180px;height:70px}
/* ===== KakaoTalk 可编辑版 ===== */
.kakao-toolbar{display:flex;gap:8px;margin:0 0 14px;flex-wrap:wrap}
.kakao-tool{background:#fee500;color:#392027;font-size:12px;font-weight:600;padding:8px 12px;border-radius:20px}
.kakao-tool:active{opacity:.7}
.chat-list button{position:relative}
.chat-list .chat-del{position:absolute;right:0;top:50%;transform:translateY(-50%);background:#ff4d4f;color:#fff;font-size:11px;padding:5px 9px;border-radius:10px;z-index:2}
.chat-list .avatar{overflow:hidden;background-size:cover;background-position:center}
.chat-list .avatar img{width:100%;height:100%;object-fit:cover;display:block}
.chat-header-avatar{width:30px;height:30px;border-radius:50%;background:#e3d9ec;background-size:cover;background-position:center;display:grid;place-items:center;font-size:14px;flex-shrink:0;overflow:hidden}
.chat-header-avatar img{width:100%;height:100%;object-fit:cover;display:block}
.chat-header{position:relative}
.chat-header b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-edit-btn{background:none;font-size:19px;color:#555;padding:4px 8px}
.bubble .bubble-del{display:inline-block;margin-left:8px;color:#bbb;font-size:11px;cursor:pointer;vertical-align:middle}
.bubble.mine .bubble-del{color:#a08a00}
.bubble .bubble-sender{display:block;font-size:10px;color:#8a7a00;font-weight:600;margin-bottom:3px}
/* 编辑弹窗 */
.kakao-modal{position:absolute;inset:0;background:#00000066;z-index:70;display:flex;align-items:center;justify-content:center;padding:20px}
.kakao-modal-card{background:#fff;border-radius:18px;width:100%;max-width:320px;max-height:80%;overflow-y:auto;padding:20px;box-shadow:0 20px 50px #0005}
.kakao-modal-card h3{margin:0 0 16px;font-size:18px;color:#222}
.kakao-field{margin-bottom:14px}
.kakao-field label{display:block;font-size:12px;color:#888;margin-bottom:6px}
.kakao-field input,.kakao-field textarea{width:100%;border:1px solid #ddd;border-radius:10px;padding:10px;font-size:14px;background:#fafafa}
.kakao-field textarea{resize:vertical;min-height:60px;line-height:1.5}
.kakao-avatar-row{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.kakao-avatar-preview{width:56px;height:56px;border-radius:50%;background:#e3d9ec;background-size:cover;background-position:center;display:grid;place-items:center;font-size:22px;color:#56465f;flex-shrink:0;overflow:hidden}
.kakao-avatar-preview img{width:100%;height:100%;object-fit:cover}
.kakao-avatar-actions{display:flex;flex-direction:column;gap:6px;font-size:12px}
.kakao-avatar-actions button{background:#eef0f2;color:#333;padding:6px 10px;border-radius:8px;font-size:12px}
.kakao-modal-actions{display:flex;gap:10px;margin-top:8px}
.kakao-modal-actions button{flex:1;padding:12px;border-radius:12px;font-size:14px;font-weight:600}
.kakao-btn-primary{background:#fee500;color:#392027}
.kakao-btn-ghost{background:#eef0f2;color:#555}
.kakao-btn-danger{background:#ff4d4f;color:#fff}
.kakao-member-list{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.kakao-member-item{display:flex;align-items:center;gap:10px;padding:8px;border:1px solid #eee;border-radius:10px;font-size:13px}
.kakao-member-item input[type=checkbox]{width:18px;height:18px;accent-color:#fee500}
.kakao-member-item .avatar{width:32px;height:32px;margin:0;font-size:14px;border-radius:50%}
.kakao-empty{text-align:center;color:#aaa;font-size:13px;padding:30px 0}
@media(max-width:600px){.stage{padding:0;background:#171820}.phone{width:min(100vw,420px);height:100svh;max-height:900px;border-radius:0;padding:0;box-shadow:none}.screen{border-radius:0}.home{padding-top:30px}.widget{margin-bottom:40px}.lock-side{display:none}}@media(min-width:601px) and (max-height:820px){.phone{height:calc(100svh - 32px);min-height:620px}.stage{padding:16px}.widget{height:125px;margin-bottom:22px}.home{padding-top:12px}.apps{gap:18px 9px}}

/* ===== 音乐歌单页 ===== */
.playlist-header{display:flex;align-items:center;gap:16px;margin:20px 0 24px;text-align:left}
.playlist-cover{width:110px;height:110px;border-radius:12px;background:linear-gradient(135deg,#5a4a7a,#2a1f3d);flex-shrink:0;background-size:cover;background-position:center;box-shadow:0 8px 20px #0004}
.playlist-info{flex:1;min-width:0}
.playlist-label{font-size:10px;letter-spacing:2px;color:#9aa8a4;margin-bottom:6px}
.playlist-title{font-size:24px;margin:0 0 6px;font-weight:600}
.playlist-meta{font-size:12px;color:#9aa8a4}
.song-list{text-align:left;margin:0 -18px}
.song-item{width:100%;display:flex;align-items:center;gap:12px;padding:10px 18px;background:none;color:#e8efec;text-align:left;border-bottom:1px solid #ffffff0d;transition:background .15s}
.song-item:active{background:#ffffff12}
.song-item.active{background:#ffffff10}
.song-thumb{width:48px;height:48px;border-radius:8px;background:linear-gradient(135deg,#5a4a7a,#2a1f3d);flex-shrink:0;background-size:cover;background-position:center;box-shadow:0 3px 8px #0003}
.song-text{flex:1;min-width:0}
.song-name{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song-artist{font-size:12px;color:#9aa8a4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.song-item.active .song-name{color:#fff}
.song-item.active .song-artist{color:#c9d6d1}
.song-dur{font-size:11px;color:#7d8a86;flex-shrink:0}
/* 播放详情页封面图 */
.cover{overflow:hidden;padding:0;position:relative}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover span,.cover b{display:none}

/* ===== Instagram 快拍查看器 ===== */
.story-viewer{position:absolute;inset:0;background:#000;z-index:60;display:flex;flex-direction:column;overflow:hidden}
.story-progress{position:absolute;top:8px;left:8px;right:8px;display:flex;gap:3px;z-index:3}
.story-progress .seg{flex:1;height:2.5px;background:#ffffff40;border-radius:2px;overflow:hidden}
.story-progress .seg .fill{height:100%;width:0;background:#fff;border-radius:2px}
.story-progress .seg.done .fill{width:100%}
.story-progress .seg.active .fill{animation:storyFill var(--dur,5s) linear forwards}
@keyframes storyFill{from{width:0}to{width:100%}}
.story-topbar{position:absolute;top:20px;left:12px;right:12px;display:flex;align-items:center;gap:10px;z-index:3}
.story-user{display:flex;align-items:center;gap:8px;color:#fff;font-size:13px;flex:1;min-width:0}
.story-avatar{width:32px;height:32px;border-radius:50%;background:#d6c8e6;color:#56465f;display:grid;place-items:center;font-size:15px;flex-shrink:0}
.story-user b{font-weight:600}
.story-time{color:#ffffffb0;font-size:11px}
.story-close{background:none;color:#fff;font-size:20px;padding:4px 8px;z-index:4}
.story-content{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;text-align:center}
.story-content img{width:100%;height:100%;object-fit:contain;object-position:center center;position:absolute;inset:0;background:#000;display:block}
.story-content .story-blank{color:#ffffff60;font-size:13px;line-height:1.8}
.story-tap{position:absolute;top:0;bottom:0;width:50%;z-index:2}
.story-tap-left{left:0}
.story-tap-right{right:0}

.story-text{position:absolute;transform:translate(-50%,-50%);padding:4px 8px;border-radius:6px;white-space:pre-wrap;text-align:center;max-width:90%;line-height:1.3;z-index:2;pointer-events:none;text-shadow:0 1px 3px rgba(0,0,0,.4)}
/* 装饰性评论框（不可交互） */
.story-reply{position:absolute;left:12px;right:12px;bottom:16px;z-index:3;display:flex;align-items:center;gap:10px;pointer-events:none}
.story-reply .reply-box{flex:1;height:44px;border-radius:22px;border:1px solid #ffffff55;background:#ffffff10;backdrop-filter:blur(8px);display:flex;align-items:center;padding:0 18px;color:#ffffffb0;font-size:13px}
.story-reply .reply-icon{width:44px;height:44px;display:grid;place-items:center;color:#fff;font-size:22px}

/* ===== Instagram 完整布局 ===== */
.ig-app{padding:52px 0 0 0!important;display:flex;flex-direction:column;overflow:hidden!important}

// Web Audio API：预解码音效，播放零延迟（避免 <audio> seek 造成的延迟）
let phoneAudioCtx=null,phoneEffectBuffer=null,phoneEffectLoading=null;
function getPhoneAudioCtx(){
  if(!phoneAudioCtx){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return null;phoneAudioCtx=new AC();}
  if(phoneAudioCtx.state==='suspended')phoneAudioCtx.resume().catch(()=>{});
  return phoneAudioCtx;
}
function loadPhoneEffect(){
  if(phoneEffectBuffer)return Promise.resolve(phoneEffectBuffer);
  if(phoneEffectLoading)return phoneEffectLoading;
  const ctx=getPhoneAudioCtx();if(!ctx)return Promise.resolve(null);
  phoneEffectLoading=fetch('sounds/phone-effects.wav').then(r=>r.arrayBuffer()).then(buf=>ctx.decodeAudioData(buf)).then(decoded=>{phoneEffectBuffer=decoded;return decoded}).catch(()=>null);
  return phoneEffectLoading;
}
// 首次用户手势时解锁音频上下文并预加载
function primePhoneAudio(){const ctx=getPhoneAudioCtx();if(ctx&&ctx.state==='suspended')ctx.resume().catch(()=>{});loadPhoneEffect();}
['pointerdown','touchstart','keydown','click'].forEach(ev=>window.addEventListener(ev,primePhoneAudio,{once:true,passive:true}));

function playPhoneEffect(start,duration){
  const ctx=getPhoneAudioCtx();if(!ctx)return;
  if(ctx.state==='suspended')ctx.resume().catch(()=>{});
  const play=()=>{
    if(!phoneEffectBuffer)return;
    const src=ctx.createBufferSource();src.buffer=phoneEffectBuffer;
    const gain=ctx.createGain();gain.gain.value=1;
    src.connect(gain).connect(ctx.destination);
    const offset=Math.max(0,Math.min(start,phoneEffectBuffer.duration));
    const dur=Math.max(0.01,Math.min(duration,phoneEffectBuffer.duration-offset));
    src.start(ctx.currentTime,offset,dur);
  };
  if(phoneEffectBuffer){play();}
  else{loadPhoneEffect().then(play);}
}

(function(){
  const lockEl=$('#lock');
  const wp=document.querySelector('.wallpaper');
  let startY=null, dragging=false;
  const THRESHOLD=90;   // 滑动超过这个距离就解锁
  function setBlur(progress){
    // progress 0~1，模糊 0~18px，同时轻微变暗
    const b=Math.min(progress,1)*18;
    const dim=Math.min(progress,1)*0.35;
    wp.style.filter='blur('+b+'px)';
    lockEl.style.filter='blur('+b+'px)';
    lockEl.style.opacity=String(1-dim);
  }
  function resetBlur(){
    wp.style.filter='';lockEl.style.filter='';lockEl.style.opacity='';
  }
  function onStart(y){if(page!=='lock'||unlocked)return;startY=y;dragging=true;}
  function onMove(y){
    if(!dragging||startY===null)return;
    const dy=startY-y;  // 上滑为正
    if(dy>0){setBlur(dy/THRESHOLD);}
    else{setBlur(0);}
  }
  function onEnd(y){
    if(page!=='lock'||unlocked){dragging=false;startY=null;resetBlur();return;}
    if(!dragging||startY===null){dragging=false;return;}
    const dy=startY-y;
    dragging=false;startY=null;
    if(dy>THRESHOLD){resetBlur();goPass();}
    else{resetBlur();}
  }
  // 触摸
  lockEl.addEventListener('touchstart',e=>{if(e.touches.length===1)onStart(e.touches[0].clientY);},{passive:true});
  lockEl.addEventListener('touchmove',e=>{if(e.touches.length===1)onMove(e.touches[0].clientY);},{passive:true});
  lockEl.addEventListener('touchend',e=>{onEnd(e.changedTouches[0].clientY);},{passive:true});
  // 鼠标
  lockEl.addEventListener('mousedown',e=>{onStart(e.clientY);});
  window.addEventListener('mousemove',e=>{if(dragging)onMove(e.clientY);});
  window.addEventListener('mouseup',e=>{if(dragging)onEnd(e.clientY);});
})();

  return m+':'+String(s).padStart(2,'0');

 musicVisualAnimations.forEach(a=>a.cancel());musicVisualLayers.forEach(el=>el.remove());musicVisualAnimations=[];musicVisualLayers=[];
 if($('#playerPage').classList.contains('hidden')||$('#music').classList.contains('hidden'))return;

 for(const selector of ['#coverBox','#songTitle','#artist']){
  const el=$(selector),rect=el.getBoundingClientRect(),base=host.getBoundingClientRect();
  const clone=el.cloneNode(true);clone.removeAttribute('id');clone.querySelectorAll('[id]').forEach(x=>x.removeAttribute('id'));clone.setAttribute('aria-hidden','true');
  Object.assign(clone.style,{position:'absolute',left:(rect.left-base.left)+'px',top:(rect.top-base.top)+'px',width:rect.width+'px',height:rect.height+'px',margin:'0',pointerEvents:'none',zIndex:'5'});
  host.append(clone);musicVisualLayers.push(clone);

  out.finished.then(()=>clone.remove()).catch(()=>{});musicVisualAnimations.push(out);

// 切换歌曲
function setSong(i,autoplay=false){
  song=(i+playlist.length)%playlist.length;
  const s=playlist[song];
  if(audio)transitionMusicVisuals(s);
  if(audio){audio.pause();audio.onended=null;}
  if(currentAudioUrl?.startsWith('blob:'))URL.revokeObjectURL(currentAudioUrl);
  // 有真实音频用真实音频，否则用合成旋律
  if(s.audio){
    currentAudioUrl=s.audio;
  }else{
    currentAudioUrl=makeAudio(song);
  }
  if(!audio){audio=document.createElement('audio');audio.id='backgroundMusic';audio.preload='auto';audio.setAttribute('playsinline','');document.body.append(audio);}
  audio.src=currentAudioUrl;
  audio.loop=repeatOne;
  audio.ontimeupdate=()=>{
    $('#seek').value=audio.currentTime;
    $('#elapsed').textContent=formatTime(audio.currentTime);
  };
  audio.onloadedmetadata=()=>{
    if(isFinite(audio.duration)&&audio.duration>0){
      $('#seek').max=audio.duration;
      $('#totalTime').textContent=formatTime(audio.duration);
    }
  };
  audio.onended=()=>{if(repeatOne){audio.currentTime=0;playAudio()}else setSong((song+1)%playlist.length,true)};
  audio.onplay=()=>{renderPlaylist();$('#play').textContent='Ⅱ';$('#play').setAttribute('aria-label','暂停');if('mediaSession' in navigator)navigator.mediaSession.playbackState='playing'};
  audio.onpause=()=>{renderPlaylist();$('#play').textContent='▶';$('#play').setAttribute('aria-label','播放');if('mediaSession' in navigator)navigator.mediaSession.playbackState='paused'};
  // 更新界面
  $('#songTitle').textContent=s.name;
  $('#artist').textContent=s.artist;
  $('#coverImg').src=s.cover;
  $('#music').style.setProperty('--album-background', 'url('+JSON.stringify(s.cover)+')');
  $('#coverImg').alt=s.name+' 专辑封面';
  $('#seek').value=0;
  $('#seek').max=s.duration;
  $('#elapsed').textContent='0:00';
  $('#totalTime').textContent=formatTime(s.duration);
  $('#play').textContent='▶';
  if('mediaSession' in navigator && 'MediaMetadata' in window){navigator.mediaSession.metadata=new MediaMetadata({title:s.name,artist:s.artist,album:s.album,artwork:s.cover?[{src:new URL(s.cover,document.baseURI).href}]:[]});}
  renderPlaylist();
  if(autoplay)playAudio();
}

function playAudio(){
  audio.play().catch(()=>{
    $('#toast').textContent='播放未开始，请再次点击播放';
    $('#toast').classList.remove('hidden');
    setTimeout(()=>$('#toast').classList.add('hidden'),2500);
  });
}

}

const worldClockCities=[{name:'神奈川',country:'日本',zone:'Asia/Tokyo'},{name:'东京',country:'日本',zone:'Asia/Tokyo'},{name:'首尔',country:'韩国',zone:'Asia/Seoul'}];
function renderWorldClocks(){
 const now=phoneNow();
 $('#worldClocks').innerHTML=worldClockCities.map(city=>{
 const parts=new Intl.DateTimeFormat('en-GB',{timeZone:city.zone,hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}).formatToParts(now);
 const value=type=>parts.find(p=>p.type===type).value;
 const hours=Number(value('hour')),minutes=Number(value('minute')),seconds=Number(value('second'));
 const date=new Intl.DateTimeFormat(window.phoneSystemLocale||'ko-KR',{timeZone:city.zone,month:'long',day:'numeric',weekday:'long'}).format(now);
 const marks=Array.from({length:12},(_,i)=>'<line x1="50" y1="8" x2="50" y2="13" transform="rotate('+(i*30)+' 50 50)"/>').join('');
 const face='<svg class="world-clock-face" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="47" fill="#faf9fc"/><g stroke="#747078" stroke-width="1.6">'+marks+'</g><g stroke-linecap="round"><line x1="50" y1="50" x2="50" y2="27" stroke="#25232b" stroke-width="4" transform="rotate('+((hours%12)*30+minutes*.5)+' 50 50)"/><line x1="50" y1="50" x2="50" y2="17" stroke="#25232b" stroke-width="2.5" transform="rotate('+(minutes*6+seconds*.1)+' 50 50)"/><line x1="50" y1="58" x2="50" y2="14" stroke="#f16a56" stroke-width="1.2" transform="rotate('+(seconds*6)+' 50 50)"/></g><circle cx="50" cy="50" r="3" fill="#f16a56"/></svg>';
 return '<div class="world-clock">'+face+'<div class="world-clock-info"><small>'+city.country+' · UTC+9</small><h3>'+city.name+'</h3><p>'+date+'</p><small class="clock-period">'+(hours<6?'凌晨':hours<12?'上午':hours<18?'下午':'晚上')+' · 24小时制</small><time aria-label="'+hours+'时'+minutes+'分'+seconds+'秒"><span>'+value('hour')+':'+value('minute')+'</span><small>:'+value('second')+'</small></time></div></div>';
 }).join('');
 const status=document.getElementById('clockSyncStatus');if(status)status.textContent=phoneClockStatus;
}
renderWorldClocks();setInterval(renderWorldClocks,1000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)renderWorldClocks()});window.addEventListener('pageshow',renderWorldClocks);window.addEventListener('focus',renderWorldClocks);

// ===== 工具函数 =====
function igEsc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function igAvatarStyle(p){
  return p&&p.avatar?'background-image:url('+igEsc(p.avatar)+');background-size:cover;background-position:center;color:transparent':'';
}
// 把 "YY.MM.DD" / "2小时前" 之类转成可排序数字
function igTimeKey(t){
  if(!t)return 0;
  const m=String(t).match(/(\d{2,4})\D+(\d{1,2})\D+(\d{1,2})/);
  if(m){
    let y=+m[1]; if(y<100)y+=2000;
    return y*10000+(+m[2])*100+(+m[3]);
  }
  return 0;

function igImagePreviewStyle(src){return igFeedPreviews[src]?'background-image:url('+igFeedPreviews[src]+');background-size:cover;background-position:center;':''}
function igWebSrc(src){return igWebImages[src]||src}
const igImageCache=new Map();
function prepareIGImage(src){src=igWebSrc(src);if(!igImageCache.has(src)){const im=new Image();im.decoding='async';const done=new Promise(resolve=>{im.onload=async()=>{try{await im.decode()}catch{}resolve(im)};im.onerror=()=>{igImageCache.delete(src);resolve(im)}});im.src=src;igImageCache.set(src,done)}return igImageCache.get(src)}
const igWarmQueue=[],igWarmQueued=new Set();let igWarmRunning=0;
function queueIGImage(src){if(!src||igWarmQueued.has(src))return;igWarmQueued.add(src);igWarmQueue.push(src);pumpIGWarmQueue()}
function pumpIGWarmQueue(){while(igWarmRunning<2&&igWarmQueue.length){const src=igWarmQueue.shift();igWarmRunning++;prepareIGImage(src).finally(()=>{igWarmRunning--;pumpIGWarmQueue()})}}
function warmIGAccount(ai){const a=igData.accounts[ai];if(!a)return;for(const p of a.posts||[]){const src=p.images?.[0];if(src&&!igThumbs[src]?.startsWith('data:'))queueIGImage(igThumbs[src]||src)}for(const st of (a.stories||[]).slice(0,1))queueIGImage(st.src)}
window.addEventListener('load',()=>{igData.accounts.forEach((_,i)=>warmIGAccount(i));});


const igLikedPosts=new Set();
function renderIGFeed(accountIndex=null,feed=$('#feed')){
  if(!feed)return;
  // 收集所有账号的帖子，带上所属账号索引
  const all=[];
  igData.accounts.forEach((a,ai)=>{
    if(accountIndex===null||ai===accountIndex)(a.posts||[]).forEach((p,pi)=>all.push({post:p,accIndex:ai,postIndex:pi}));
  });
  all.sort((x,y)=>igTimeKey(y.post.time)-igTimeKey(x.post.time));
  if(!all.length){
    feed.innerHTML='<div class="ig-end">还没有帖子</div>';
    return;
  }
  feed.innerHTML=all.map(({post:p,accIndex:ai,postIndex:pi},feedIndex)=>{
    const prof=(igData.accounts[ai]||{}).profile||{};
    const imgs=(p.images||[]).filter(Boolean).map(igWebSrc);
    let media;
    if(imgs.length===0){
      media='<div style="aspect-ratio:1;background:#efefef;display:grid;place-items:center;color:#bbb;font-size:12px">暂无图片</div>';
    }else if(imgs.length===1){
      media='<img style="'+igImagePreviewStyle(imgs[0])+'" src="'+igEsc(imgs[0])+'" loading="'+(feedIndex<2?'eager':'lazy')+'" decoding="async" fetchpriority="'+(feedIndex===0?'high':'low')+'" alt="">';
    }else{
      const slides=imgs.map((src,slideIndex)=>'<img style="'+igImagePreviewStyle(src)+'" src="'+igEsc(src)+'" loading="'+(feedIndex<2&&slideIndex===0?'eager':'lazy')+'" decoding="async" fetchpriority="'+(feedIndex===0&&slideIndex===0?'high':'low')+'" alt="">').join('');
      const dots=imgs.map((_,i)=>'<span class="ig-dot'+(i===0?' on':'')+'"></span>').join('');
      media='<div class="ig-carousel">'
        +'<div class="ig-carousel-track" data-carousel>'+slides+'</div>'
        +'<div class="ig-carousel-dots">'+dots+'</div>'
        +'<div class="ig-carousel-count">1/'+imgs.length+'</div>'
        +'</div>';
    }
    const likeKey=ai+':'+pi,liked=igLikedPosts.has(likeKey);
    const likeCount=(Number(String(p.likes||0).replace(/,/g,''))||0)+(liked?1:0);
    const avStyle=igAvatarStyle(prof);
    const avText=prof.avatar?'':igEsc((prof.id||'?').slice(0,1).toUpperCase());
    return '<article class="post" data-post-index="'+pi+'">'
      +'<div class="post-head" data-open-acc="'+ai+'">'
        +'<span data-story-ring-owner="'+igEsc(prof.id)+'" class="avatar '+(storiesForAccount(prof.id).length?'feed-story-ring':'')+' '+(accountStoriesSeen(prof.id)?'stories-seen':'')+'" style="'+avStyle+'">'+avText+'</span>'
        +'<b>'+igEsc(prof.id||'account')+'</b>'
      +'</div>'
      +media
      +'<div class="post-actions">'
        +'<button data-like-key="'+likeKey+'" class="ig-like '+(liked?'liked':'')+'" aria-label="'+(liked?'取消点赞':'点赞')+'" aria-pressed="'+liked+'">'+(liked?'♥':'♡')+'</button>'
        +'<button aria-label="评论">💬</button>'
        +'<button aria-label="分享">➤</button>'
      +'</div>'
      +'<p><b data-like-count="'+likeKey+'" data-base-likes="'+(likeCount-(liked?1:0))+'">'+likeCount+' 次赞</b></p>'
      +'<p><b>'+igEsc(prof.id||'account')+'</b> '+igEsc(p.caption||'')+'</p>'
      +(p.time?'<p style="color:#8e8e8e;font-size:11px">'+igEsc(p.time)+'</p>':'')
      +'</article>';
  }).join('');
  // 点赞
  feed.querySelectorAll('.ig-like').forEach(b=>b.onclick=()=>{const key=b.dataset.likeKey,on=!igLikedPosts.has(key);if(on)igLikedPosts.add(key);else igLikedPosts.delete(key);document.querySelectorAll('[data-like-key="'+key+'"]').forEach(el=>{el.classList.toggle('liked',on);el.textContent=on?'♥':'♡';el.setAttribute('aria-label',on?'取消点赞':'点赞');el.setAttribute('aria-pressed',String(on))});document.querySelectorAll('[data-like-count="'+key+'"]').forEach(el=>el.textContent=(Number(el.dataset.baseLikes)+(on?1:0))+' 次赞')});
  // 点头像/用户名打开该账号主页
  feed.querySelectorAll('[data-open-acc]').forEach(h=>h.onclick=()=>openIGProfile(+h.dataset.openAcc));
  // 轮播圆点跟随
  feed.querySelectorAll('[data-carousel]').forEach(track=>{
    const dots=track.parentElement.querySelectorAll('.ig-dot');
    const count=track.parentElement.querySelector('.ig-carousel-count');
    track.addEventListener('scroll',()=>{
      const i=Math.round(track.scrollLeft/track.clientWidth);
      dots.forEach((d,k)=>d.classList.toggle('on',k===i));
      if(count)count.textContent=(i+1)+'/'+dots.length;
    },{passive:true});
  });
}

// ===== IG 个人主页渲染 =====
function renderIGProfile(accIndex){
  const acc=igData.accounts[accIndex!=null?accIndex:igAccountIndex]||{};
  const prof=acc.profile||{};
  const posts=acc.posts||[];
  const ai=accIndex!=null?accIndex:igAccountIndex;
  $('#igProfileName').textContent=prof.id||'我的主页';
  const av=$('#igProfileAvatar');
  av.dataset.storyOwner=prof.id||'';
  const hasStories=storiesForAccount(prof.id).length>0;
  av.disabled=!hasStories;av.classList.toggle('has-stories',hasStories);av.classList.toggle('stories-seen',hasStories&&accountStoriesSeen(prof.id));av.style.setProperty('--story-ring-color',accountStoriesSeen(prof.id)?'#b9b9bf':'conic-gradient(#d62e86,#913fd0,#e84472,#ffb34a,#ffc84d,#d62e86)');
  av.onclick=()=>{if(hasStories)openAccountStory(ai)};
  if(prof.avatar){
    av.style.backgroundImage='url('+prof.avatar+')';
    av.style.backgroundSize='cover';
    av.style.backgroundPosition='center';
    av.textContent='';
  }else{
    av.style.backgroundImage='';
    av.textContent=(prof.id||'我').slice(0,1).toUpperCase();
  }
  $('#igPostCount').textContent=posts.length;
  $('#igFollowerCount').textContent=prof.followers??0;
  $('#igFollowingCount').textContent=prof.following??0;
  $('#igProfileBio').textContent=prof.bio||'还没有简介';
  const grid=$('#igProfileGrid');
  if(!posts.length){
    grid.innerHTML='<div class="empty">还没有帖子</div>';
    return;
  }
  grid.innerHTML=posts.map((p,i)=>({post:p,index:i})).sort((a,b)=>igTimeKey(b.post.time)-igTimeKey(a.post.time)).map(({post:p,index:i})=>{
    const first=(p.images||[]).filter(Boolean)[0];

// ===== 快拍查看器 =====
let storyList=[], storyIndex=0, storyTimer=null, storyOwner='',storyNavigationVersion=0;

async function openAccountStory(ai,startIndex=0,internalTransition=false){
  ++storyNavigationVersion;
  if(!internalTransition){storyTurning=false;document.querySelectorAll('.story-cube-old,.story-transition-backdrop').forEach(el=>el.remove());}
  const prof=(igData.accounts[ai]||{}).profile||{};
  storyList=storiesForAccount(prof.id);
  storyOwner=prof.id||'动态';
  if(!storyList.length)return;
  storyIndex=Math.max(0,Math.min(startIndex,storyList.length-1));
  const nextAccount=igData.accounts.slice(ai+1).find(a=>storiesForAccount((a.profile||{}).id).length);
  if(nextAccount)prepareIGImage(storiesForAccount(nextAccount.profile.id)[0].src);
  $('#storyViewer').classList.remove('hidden');
  await showStory();
}

function openStory(){ openAccountStory(igAccountIndex); }

function storyNeighbors(owner,index){
 const timeline=igData.accounts.flatMap(a=>storiesForAccount(a.profile.id).map((story,i)=>({owner:a.profile.id,index:i,story})));
 const at=timeline.findIndex(item=>item.owner===owner&&item.index===index);
 if(at<0)return [];
 return timeline.slice(Math.max(0,at-2),at).concat(timeline.slice(at+1,at+3)).map(item=>item.story).filter(st=>st.src);
}
let storyLoadToken=0;
async function showStory(){
  const token=++storyLoadToken;
  clearTimeout(storyReadTimer);displayedIGStory=null;
  clearTimeout(storyTimer);
  const neighborLoads=storyNeighbors(storyOwner,storyIndex).map(st=>prepareIGImage(st.src));
  const owner=storyOwner;
  const requested=storyList[storyIndex];
  $('#storyName').textContent=owner;
  if($('#storyContent').dataset.owner!==owner){$('#storyContent').replaceChildren();$('#storyContent').dataset.owner=owner;}
  if(requested?.src){
    const content=$('#storyContent');
    if(!content.querySelector('img'))content.innerHTML='<div class="story-blank">正在加载照片…</div>';
    await Promise.race([prepareIGImage(requested.src),new Promise(resolve=>setTimeout(resolve,4000))]);
    if(token!==storyLoadToken)return;
  }

  const s=requested;
  if(!s){ closeStory(); return; }
  // 进度条
  const prog=$('#storyProgress');
  prog.innerHTML=storyList.map((_,i)=>{
    const cls=i<storyIndex?'done':(i===storyIndex?'active':'');
    const dur=(storyList[i].duration||5)+'s';
    return '<div class="seg '+cls+'"><div class="fill" style="--dur:'+dur+'"></div></div>';
  }).join('');
  // 顶部信息
  const prof=(igData.accounts.find(a=>(a.profile||{}).id===storyOwner)||{}).profile||{};
  const av=$('#storyAvatar');
  if(prof.avatar){
    av.style.backgroundImage='url('+prof.avatar+')';
    av.style.backgroundSize='cover';
    av.style.backgroundPosition='center';
    av.textContent='';
  }else{
    av.style.backgroundImage='';
    av.textContent=storyOwner.slice(0,1).toUpperCase();
  }
  $('#storyName').textContent=storyOwner;
  $('#storyTime').textContent=s.date||'刚刚';
  // 内容
  const content=$('#storyContent');
  if(s.type==='image'&&s.src){
    content.innerHTML='<img src="'+igEsc(igWebSrc(s.src))+'" alt="">';
  }else{
    content.innerHTML='<div class="story-blank">'+(s.text?igEsc(s.text):'（空白快拍）')+'</div>';
  }
  // 文字叠加
  if(Array.isArray(s.texts)){
    s.texts.forEach(t=>{
      if(!t||!t.text)return;
      const el=document.createElement('div');
      el.className='story-text';
      el.textContent=t.text;
      el.style.left=(t.x!=null?t.x:50)+'%';
      el.style.top=(t.y!=null?t.y:50)+'%';
      el.style.color=t.color||'#fff';
      el.style.fontSize=(t.size||18)+'px';
      content.appendChild(el);
    });
  }
  // Preloading is never a read: count only a displayed frame after visible dwell time.
  displayedIGStory={owner:storyOwner,key:storyReadKey(s),at:performance.now()};
  if(token===storyLoadToken)recordCurrentStoryRead();
  // Neighbor downloads never block navigation or the cross-account animation.
  Promise.all(neighborLoads).catch(()=>{});
  if(token!==storyLoadToken||owner!==storyOwner)return;
  // 自动前进
  clearTimeout(storyTimer);
  const dur=(s.duration||5)*1000;
  storyTimer=setTimeout(nextStory,dur);
}

let storyTurning=false;
async function turnStoryAccount(ai,startIndex=0,direction=1){
 if(storyTurning)return;storyTurning=true;clearTimeout(storyTimer);
 const navigation=storyNavigationVersion;
 const viewer=$('#storyViewer'),parent=viewer.parentElement;
 const backdrop=document.createElement('div');backdrop.className='story-transition-backdrop';backdrop.style.cssText='position:absolute;inset:0;background:#000;z-index:59;pointer-events:none';parent.append(backdrop);
 const old=viewer.cloneNode(true);old.removeAttribute('id');old.querySelectorAll('[id]').forEach(el=>el.removeAttribute('id'));old.classList.add('story-cube-old');old.setAttribute('aria-hidden','true');old.inert=true;
 parent.append(old);
 try{
  const target=igData.accounts[ai],stories=storiesForAccount(target.profile.id);
  await Promise.race([prepareIGImage(stories[startIndex].src),new Promise(resolve=>setTimeout(resolve,2000))]);
  if(viewer.classList.contains('hidden')||navigation!==storyNavigationVersion)return;
  const opening=openAccountStory(ai,startIndex,true);
  await Promise.race([opening,new Promise(resolve=>setTimeout(resolve,2000))]);
  if(viewer.classList.contains('hidden')||storyOwner!==target.profile.id)return;
  clearTimeout(storyTimer);
  const half=viewer.clientWidth/2;const options={duration:460,easing:'cubic-bezier(.22,.65,.3,1)',fill:'none'};
  const face=(angle,scale)=>'perspective(1000px) scale('+scale+') translateZ(-'+half+'px) rotateY('+angle+'deg) translateZ('+half+'px)';
  await Promise.all([
   old.animate([{transform:face(0,1),filter:'brightness(1)'},{transform:face(-45*direction,1.12),filter:'brightness(.8)',offset:.5},{transform:face(-90*direction,1.08),filter:'brightness(.55)'}],options).finished,
   viewer.animate([{transform:face(90*direction,1.08),filter:'brightness(.55)'},{transform:face(45*direction,1.12),filter:'brightness(.8)',offset:.5},{transform:face(0,1),filter:'brightness(1)'}],options).finished
  ]);
  if(!viewer.classList.contains('hidden'))storyTimer=setTimeout(nextStory,(storyList[storyIndex].duration||5)*1000);
 }finally{old.remove();backdrop.remove();storyTurning=false;}
}
function nextStory(){
  if(storyTurning)return;
  recordCurrentStoryRead();
  if(storyIndex<storyList.length-1){ storyIndex++; showStory(); }
  else {
    const current=igData.accounts.findIndex(a=>(a.profile||{}).id===storyOwner);
    const next=igData.accounts.findIndex((a,i)=>i>current && storiesForAccount((a.profile||{}).id).length);
    if(next>=0)turnStoryAccount(next);else closeStory();
  }
}
function prevStory(){
  if(storyTurning)return;
  recordCurrentStoryRead();
  if(storyIndex>0){ storyIndex--; showStory(); }
  else {
    const current=igData.accounts.findIndex(a=>(a.profile||{}).id===storyOwner);
    let previous=current-1;
    while(previous>=0&&!storiesForAccount(igData.accounts[previous].profile.id).length)previous--;
    if(previous>=0)turnStoryAccount(previous,storiesForAccount(igData.accounts[previous].profile.id).length-1,-1);
    else showStory();
  }
}
function closeStory(){
  ++storyNavigationVersion;storyTurning=false;document.querySelectorAll('.story-cube-old,.story-transition-backdrop').forEach(el=>el.remove());
  recordCurrentStoryRead();
  ++storyLoadToken;
  clearTimeout(storyReadTimer);displayedIGStory=null;
  clearTimeout(storyTimer);
  storyTimer=null;
  $('#storyViewer').classList.add('hidden');
  refreshIGStoryRings();
}

// 头像选择：读取本地图片转 dataURL
function pickImage(cb){
  const inp=document.createElement('input');
  inp.type='file';inp.accept='image/*';
  inp.onchange=()=>{
    const f=inp.files&&inp.files[0];
    if(!f)return;
    const r=new FileReader();
    r.onload=()=>cb(r.result);
    r.readAsDataURL(f);
  };
  inp.click();
}

// 4) 底部横杠上滑：回到主屏幕（像真 iPhone）
(function(){
  let sy=null, sx=null, active=false;
  const screen=document.querySelector('.screen');
  screen.addEventListener('touchstart',e=>{
    if(e.touches.length!==1)return;
    const t=e.touches[0];
    const rect=screen.getBoundingClientRect();
    // 底部 40px 区域内才算手势区
    if(t.clientY - rect.top > rect.height - 40){
      sy=t.clientY; sx=t.clientX; active=true;
    }else{ active=false; }
  },{passive:true});
  screen.addEventListener('touchend',e=>{
    if(!active||sy===null)return;
    const dy=sy - e.changedTouches[0].clientY;  // 上滑为正
    const dx=Math.abs(e.changedTouches[0].clientX - sx);
    if(dy>50 && dy>dx*1.2){
      // 上滑：关闭浮层或回主屏
      if(!$('#viewer').classList.contains('hidden')){ if(typeof closeViewer==='function')closeViewer();else $('#viewer').classList.add('hidden'); }
      else if(!$('#storyViewer').classList.contains('hidden')){ closeStory(); }
      else if(page!=='home' && page!=='lock' && page!=='pass'){ home(); }
    }
    sy=null; sx=null; active=false;
  },{passive:true});
})();

const deliveredKktNotifications=new Set();

function scheduleKktNotification(){
 if(window.selectedPhoneDate&&window.selectedPhoneDate!==todaySeoulKey())return;
 if(kktNotificationScheduled||!unlocked||document.documentElement.hasAttribute('data-kkt-editor'))return;
 const config=kakaoData.notification;if(!config?.enabled||!config.text)return;kktNotificationScheduled=true;
 kktNotificationTimer=setTimeout(()=>{if(page!=='home'){kktNotificationScheduled=false;return}showKktNotification(config)},Math.max(0,Number(config.delay)||0)*1000);
}
function showKktNotification(config=kakaoData.notification){
 if(!config)return;document.querySelector('.kkt-notification')?.remove();const c=kakaoData.chats.find(c=>c.id===config.chatId);if(!c)return;
 if(!document.documentElement.hasAttribute('data-kkt-editor')){
  const notificationKey=JSON.stringify([config.chatId,config.text,config.originalText||'']);
  if(!deliveredKktNotifications.has(notificationKey)){
   deliveredKktNotifications.add(notificationKey);
   c.messages ||= [];
   c.messages.push({text:config.text,mine:false,sender:c.name,...(config.originalText?{originalText:config.originalText,language:config.language||'ko'}:{}),notificationKey});
   renderKakaoList();if(selectedChatId===c.id)renderMessages();
  }
 }

 let notificationDrag=null;

 banner.addEventListener('pointerdown',e=>{if(!e.isPrimary)return;notificationDrag={x:e.clientX,y:e.clientY}});
 banner.addEventListener('pointermove',e=>{if(!notificationDrag)return;const dy=e.clientY-notificationDrag.y;if(dy< -8){banner.setPointerCapture(e.pointerId);banner.getAnimations().forEach(a=>a.cancel());banner.style.transform='translateY('+dy+'px)';}});
 function finishNotificationDrag(e){if(!notificationDrag)return;const dy=e.clientY-notificationDrag.y;notificationDrag=null;if(dy< -35){banner.dataset.dismissing='true';banner.animate([{transform:banner.style.transform||'translateY(0)',opacity:1},{transform:'translateY(-150%)',opacity:0}],{duration:180,easing:'ease-in'}).finished.then(()=>banner.remove()).catch(()=>banner.remove())}else{banner.style.transform='';}}
 banner.addEventListener('pointerup',finishNotificationDrag);banner.addEventListener('pointercancel',()=>{notificationDrag=null;banner.style.transform=''});
banner.animate([{transform:'translateY(-140%)',opacity:0},{transform:'translateY(0)',opacity:1}],{duration:420,easing:'cubic-bezier(.2,.8,.2,1)'});if(config.sound)playKktAlert();setTimeout(()=>{if(!banner.isConnected||banner.dataset.dismissing==='true')return;banner.dataset.dismissing='true';banner.getAnimations().forEach(a=>a.cancel());banner.animate([{transform:banner.style.transform||'translateY(0)',opacity:1},{transform:'translateY(-150%)',opacity:0}],{duration:260,easing:'ease-in'}).finished.then(()=>banner.remove()).catch(()=>banner.remove())},5000);
