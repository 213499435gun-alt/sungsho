const songs=['晨间漫游','海边来信','星光慢拍'];let song=0,audio;function makeAudio(index){let rate=16000,len=30*rate,buf=new ArrayBuffer(44+len*2),v=new DataView(buf);function str(o,s){[...s].forEach((c,i)=>v.setUint8(o+i,c.charCodeAt(0)))}str(0,'RIFF');v.setUint32(4,36+len*2,true);str(8,'WAVEfmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,rate,true);v.setUint32(28,rate*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);str(36,'data');v.setUint32(40,len*2,true);let scales=[[261.63,329.63,392,523.25,440,392,329.63,293.66],[293.66,369.99,440,587.33,493.88,440,369.99,329.63],[220,261.63,329.63,440,392,329.63,261.63,246.94]],scale=scales[index];for(let i=0;i<len;i++){let t=i/rate,beat=Math.floor(t/.375),phase=t% .375,f=scale[beat%8],env=Math.exp(-phase*8),fade=Math.min(t,1,30-t),s=(Math.sin(2*Math.PI*f*t)*.35+Math.sin(2*Math.PI*f*2*t)*.08)*env; s+=.10*Math.sin(2*Math.PI*scale[Math.floor(t/3)%4]/2*t)*Math.min(1,(t%3)*3);v.setInt16(44+i*2,Math.max(-1,Math.min(1,s*fade)) *26000,true)}return URL.createObjectURL(new Blob([buf],{type:'audio/wav'}))}const urls={};function setSong(i,autoplay=false){song=(i+3)%3;if(audio){audio.pause();audio.src=''}if(!urls[song])urls[song]=makeAudio(song);audio=new Audio(urls[song]);audio.volume=+$('#volume').value;audio.ontimeupdate=()=>{$('#seek').value=audio.currentTime;$('#elapsed').textContent='0:'+String(Math.floor(audio.currentTime)).padStart(2,'0')};audio.onended=()=>setSong(song+1,true);audio.onplay=()=>{$('#play').textContent='Ⅱ';$('#play').setAttribute('aria-label','暂停')};audio.onpause=()=>{$('#play').textContent='▶';$('#play').setAttribute('aria-label','播放')};$('#songTitle').textContent=songs[song];$('#coverTitle').textContent=['慢慢，出发','听海，来信','今晚，有星'][song];$('#seek').value=0;$('#elapsed').textContent='0:00';$('#play').textContent='▶';$('#tracks').innerHTML=songs.map((s,i)=>'<button class="track '+(i===song?'active':'')+'" data-song="'+i+'"><span>0'+(i+1)+' &nbsp; '+s+'</span><span>0:30</span></button>').join('');$$('[data-song]').forEach(b=>b.onclick=()=>setSong(+b.dataset.song,true));if(autoplay)playAudio()}function playAudio(){audio.play().catch(()=>{$('#toast').textContent='播放未开始，请再次点击播放';$('#toast').classList.remove('hidden');setTimeout(()=>$('#toast').classList.add('hidden'),2500)})}setSong(0);$('#play').onclick=()=>audio.paused?playAudio():audio.pause();$('#prev').onclick=()=>setSong(song-1,true);$('#next').onclick=()=>setSong(song+1,true);$('#seek').oninput=e=>audio.currentTime=+e.target.value;$('#volume').oninput=e=>audio.volume=+e.target.value;
