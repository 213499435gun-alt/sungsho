<!doctype html><meta charset="utf-8"><title>KakaoTalk 本地编辑器</title>
<style>body{font:15px system-ui;background:#edf0f3;max-width:1000px;margin:30px auto}button,input,textarea,select{font:inherit;padding:9px;margin:5px;border:1px solid #ccc;border-radius:8px}button{cursor:pointer;background:#ffe500}textarea{width:65%;vertical-align:middle}section{background:white;padding:15px;border-radius:15px;margin:15px 0}.row{background:#b6ccdc;padding:12px;margin:8px;border-radius:10px}.divider{text-align:center;background:#d4dce2}img{width:60px;height:60px;object-fit:cover}small{color:#555}</style>
<h1>KakaoTalk 本地内容编辑器</h1><p>修改后导出 JSON，交给我更新网站。草稿自动保存在当前浏览器。</p>
<button id="load">载入网页原始内容</button><button id="export">导出 JSON</button><input id="import" type="file" accept="application/json"><span id="status"></span>
<div class="workspace"><aside><h2>网页实时预览</h2><p>点击好友、群聊、返回和消息直接编辑。</p><iframe id="preview" title="网页实际聊天预览"></iframe></aside><main><section id="notificationEditor"></section><section id="chatOrder"></section><section id="me"></section><section><select id="chats"></select><button id="add">添加聊天</button><div id="profile"></div></section><section id="messages"></section>
</main></div><style>#messages .row>button:not(.edit-divider){display:none}body{max-width:1350px;padding:0 20px}.workspace{display:grid;grid-template-columns:440px 1fr;gap:24px}aside{position:sticky;top:10px;align-self:start}iframe{width:430px;height:850px;border:0;border-radius:25px;background:#ddd}main{min-width:0}.row.selected{outline:3px solid #d9b500}@media(max-width:900px){.workspace{display:block}aside{position:static}}</style><script>
async function convertHeic(file){if(!/\.hei[cf]$/i.test(file.name)&&!/^image\/hei[cf]/i.test(file.type))return file;$('#status').textContent='正在转换 HEIC…';const r=await fetch('/convert-heic',{method:'POST',body:file});if(!r.ok)throw Error('HEIC 转换失败，请使用端口 8766 的本地编辑器。');return await r.blob()}
let data,ci=0;const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){syncPreview();try{localStorage.setItem('kakao-editor-draft',JSON.stringify(data));$('#status').textContent='草稿已保存'}catch{$('#status').textContent='存储空间不足，请导出 JSON'}}
async function load(){let h=await(await fetch('index.html',{cache:'no-store'})).text();let s=h.slice(h.indexOf('const KAKAO_DEFAULT=')+'const KAKAO_DEFAULT='.length,h.indexOf('let kakaoData=null;')).trim().replace(/;$/,'');data=Function('return ('+s+')')();ci=0;save();render()}
function avatar(target){let input=document.createElement('input');input.type='file';input.accept='image/*,.heic,.HEIC,.heif,.HEIF';input.onchange=async()=>{let f=input.files[0];if(!f)return;try{f=await convertHeic(f)}catch(e){alert(e.message);return}let url=URL.createObjectURL(f),im=new Image();im.onload=()=>{let n=Math.min(im.width,im.height),c=document.createElement('canvas');c.width=c.height=400;c.getContext('2d').drawImage(im,(im.width-n)/2,(im.height-n)/2,n,n,0,0,400,400);target.avatar=c.toDataURL('image/jpeg',.9);URL.revokeObjectURL(url);save();render()};im.onerror=()=>{URL.revokeObjectURL(url);alert('浏览器无法读取这张图片，请选择 JPG、PNG 或 WebP 格式。')};im.src=url};input.click()}
function render(){renderChatOrder();renderNotificationEditor();let c=data.chats[ci];$('#me').innerHTML='我的名字 <input id="myname" value="'+esc(data.me.name)+'"><button id="myavatar">上传我的头像</button>';$('#myname').oninput=e=>{data.me.name=e.target.value;save()};$('#myavatar').insertAdjacentHTML('afterend','<img alt="我的头像" src="'+esc(data.me.avatar||'')+'">');$('#myavatar').onclick=()=>avatar(data.me);$('#chats').innerHTML=data.chats.map((x,i)=>'<option value="'+i+'">'+esc(x.name)+'</option>').join('');$('#chats').value=ci;if(!c)return;$('#profile').innerHTML='<input id="name" value="'+esc(c.name)+'"><button id="avatar">上传头像（居中裁方）</button><img src="'+esc(c.avatar||'')+'">';$('#name').oninput=e=>{c.name=e.target.value;save()};$('#avatar').onclick=()=>avatar(c);let box=$('#messages');box.replaceChildren();function insert(i){let b=document.createElement('button');b.textContent='＋ 在这里插入消息 / 日期时间分隔';b.onclick=()=>$('#preview').contentWindow.postMessage({kind:'kakao-local-edit',id:c.id,index:i,type:'divider'},location.origin);box.append(b)}insert(0);c.messages.forEach((m,i)=>{let row=document.createElement('div');row.dataset.messageIndex=i;row.className='row'+(m.type==='divider'?' divider':'');row.innerHTML=m.type==='divider'?'<input data-key="date" placeholder="日期，例如 2026年10月24日" value="'+esc(m.mode==='missing'?'聊天记录缺失':m.mode==='text'?m.text:m.date)+'"><input data-key="time" placeholder="时间，例如 下午 8:30" value="'+esc(m.time)+'">':'<select data-key="mine"><option value="false">对方</option><option value="true">我</option></select><input data-key="sender" placeholder="发送者" value="'+esc(m.sender)+'"><textarea data-key="text">'+esc(m.text)+'</textarea>';row.querySelectorAll('[data-key]').forEach(el=>{if(el.dataset.key==='mine')el.value=String(!!m.mine);if(el.dataset.key==='text')el.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing&&e.keyCode!==229&&el.selectionStart===el.selectionEnd&&el.selectionEnd===el.value.length&&el.value.trim()){e.preventDefault();save();el.blur();$('#status').textContent='气泡已保存'}};el.oninput=()=>{m[el.dataset.key]=el.dataset.key==='mine'?el.value==='true':el.value;save()}});let del=document.createElement('button');del.textContent='删除';del.onclick=()=>{c.messages.splice(i,1);save();render()};if(m.type==='divider'){const edit=document.createElement('button');edit.textContent='编辑日期分隔';edit.className='edit-divider';edit.onclick=()=>$('#preview').contentWindow.postMessage({kind:'kakao-local-edit',id:c.id,index:i,type:'divider',existing:true},location.origin);row.append(edit)}box.append(row);insert(i+1)})}
$('#chats').onchange=e=>{ci=+e.target.value;render()};$('#add').onclick=()=>{data.chats.push({id:'c'+Date.now(),type:'friend',name:'新聊天',avatar:'',members:[],messages:[]});ci=data.chats.length-1;save();render()};$('#load').onclick=()=>{if(confirm('用网页内容替换当前草稿？'))load()};$('#export').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='kakao-data.json';a.click();URL.revokeObjectURL(a.href)};$('#import').onchange=async e=>{try{let d=JSON.parse(await e.target.files[0].text());if(!d.me||!Array.isArray(d.chats))throw Error('格式不正确');data=d;ci=0;save();render()}catch(err){alert(err.message)}};
function renderChatOrder(){
 const box=$('#chatOrder');box.innerHTML='<h3>主页聊天顺序</h3><p>从上到下就是网页显示的顺序。</p>'+data.chats.map((c,i)=>'<div style="display:flex;align-items:center;gap:8px"><span style="flex:1">'+(i+1)+'. '+esc(c.name)+'</span><button data-move-chat="'+i+'" data-step="-1" '+(i===0?'disabled':'')+'>↑ 上移</button><button data-move-chat="'+i+'" data-step="1" '+(i===data.chats.length-1?'disabled':'')+'>↓ 下移</button></div>').join('');
 box.querySelectorAll('[data-move-chat]').forEach(button=>button.onclick=()=>{const from=Number(button.dataset.moveChat),to=from+Number(button.dataset.step);if(to<0||to>=data.chats.length)return;const selected=data.chats[ci]?.id;const [chat]=data.chats.splice(from,1);data.chats.splice(to,0,chat);ci=Math.max(0,data.chats.findIndex(c=>c.id===selected));save();render()});
}

function renderNotificationEditor(){
 data.notification ||= {enabled:true,chatId:data.chats[0]?.id||'',text:'有一条新消息',delay:1,sound:true};const n=data.notification,box=$('#notificationEditor');
 box.innerHTML='<h3>解锁后的 KKT 通知</h3><label><input id="notifyEnabled" type="checkbox" '+(n.enabled?'checked':'')+'>启用通知</label><label>来自哪个聊天<select id="notifyChat">'+data.chats.map(c=>'<option value="'+esc(c.id)+'">'+esc(c.name)+'</option>').join('')+'</select></label><label>通知内容<textarea id="notifyText">'+esc(n.text)+'</textarea></label><label>延迟秒数<input id="notifyDelay" type="number" min="0" max="60" value="'+esc(n.delay)+'"></label><label><input id="notifySound" type="checkbox" '+(n.sound?'checked':'')+'>播放提示音</label><button id="notifyTest">预览通知</button>';
 $('#notifyChat').value=n.chatId;
 for(const [id,key] of [['notifyEnabled','enabled'],['notifyChat','chatId'],['notifyText','text'],['notifyDelay','delay'],['notifySound','sound']])$('#'+id).oninput=e=>{n[key]=e.target.type==='checkbox'?e.target.checked:key==='delay'?Math.min(60,Math.max(0,Number(e.target.value)||0)):e.target.value;save()};
 $('#notifyTest').onclick=()=>$('#preview').contentWindow.postMessage({kind:'kakao-preview-notification',config:n},location.origin);
}

let previewReady=false;
function syncPreview(){if(previewReady&&data)$('#preview').contentWindow.postMessage({kind:'kakao-data',data},location.origin)}
async function initPreview(){
 let h=await(await fetch('index.html',{cache:'no-store'})).text();
 h=h.replace('<html lang="zh-CN">','<html lang="zh-CN" data-kkt-editor>');
 h=h.replace('</style>','#kakao .chat-del,#kakao .bubble-del{display:none!important}</style>');
 h=h.replace('<head>','<head><base href="'+location.origin+'/">');
 // The preview uses isolated storage; opening it cannot change the public page's local chat history.
 h=h.replaceAll("'galaxy-kakao'","'kakao-editor-preview'");
 const bridge=`<style>body{margin:0!important;min-height:0!important;padding:0!important;background:transparent!important}body>main{padding:0!important;min-height:0!important}.phone{margin:0 auto!important}.editor-insert{align-self:center;background:#ffffff99;border-radius:12px;font-size:10px;padding:3px 10px;cursor:pointer}</style><script>
 unlocked=true;show('kakao');
 const editorOriginalSave=saveKakao;
 saveKakao=function(){parent.postMessage({kind:'kakao-preview-change',data:kakaoData},parent.location.origin)};
 const editorOriginalOpen=openChat;
 openChat=function(id){editorOriginalOpen(id);parent.postMessage({kind:'kakao-select',id},parent.location.origin)};
 const editorOriginalRender=renderMessages;
 renderMessages=function(){editorOriginalRender();const c=kakaoData.chats.find(x=>x.id===selectedChatId);if(!c)return;const box=document.querySelector('#messages');const nodes=[...box.children];function insert(i,before){const b=document.createElement('button');b.className='editor-insert';b.textContent='＋ 消息 / 日期时间';b.onclick=()=>parent.postMessage({kind:'kakao-insert',id:c.id,index:i},parent.location.origin);box.insertBefore(b,before)}nodes.forEach((n,i)=>{n.style.cursor='pointer';n.onclick=e=>{if(e.target.closest('.bubble-del'))return;parent.postMessage({kind:'kakao-message',id:c.id,index:i},parent.location.origin)};insert(i,n)});insert(nodes.length,null)};
 pickImage=function(cb){const input=document.createElement('input');input.type='file';input.accept='image/*,.heic,.HEIC,.heif,.HEIF';input.onchange=async()=>{let f=input.files[0];if(!f)return;try{f=await parent.convertHeic(f)}catch(e){alert(e.message);return}const url=URL.createObjectURL(f),im=new Image();im.onload=()=>{const n=Math.min(im.width,im.height),can=document.createElement('canvas');can.width=can.height=400;can.getContext('2d').drawImage(im,(im.width-n)/2,(im.height-n)/2,n,n,0,0,400,400);cb(can.toDataURL('image/jpeg',.9));URL.revokeObjectURL(url)};im.onerror=()=>{URL.revokeObjectURL(url);alert('浏览器无法读取这张图片，请选择 JPG、PNG 或 WebP 格式。')};im.src=url};input.click()};
 addEventListener('message',e=>{if(e.source!==parent||e.origin!==parent.location.origin||e.data.kind!=='kakao-data')return;const pos=document.querySelector('#messages').scrollTop;kakaoData=e.data.data;renderKakaoList();if(selectedChatId){renderMessages();requestAnimationFrame(()=>{const box=document.querySelector('#messages');box.scrollTop=box.scrollHeight});const c=kakaoData.chats.find(x=>x.id===selectedChatId);if(c)document.querySelector('#chatName').textContent=c.name}});
 parent.postMessage({kind:'kakao-ready'},parent.location.origin);
 <\/script>`;
 h=h.replace('</body>',bridge+'<script src="kkt-preview-controls.js?v=optional-date-7"><\/script></body>');$('#preview').srcdoc=h;
}
addEventListener('message',e=>{
 if(e.source!==$('#preview').contentWindow||e.origin!==location.origin)return;
 const msg=e.data;
 if(msg.kind==='kakao-ready'){previewReady=true;syncPreview();return}
 if(msg.kind==='kakao-preview-change'){data=msg.data;ci=Math.max(0,Math.min(ci,data.chats.length-1));try{localStorage.setItem('kakao-editor-draft',JSON.stringify(data));$('#status').textContent='预览修改已保存'}catch{$('#status').textContent='请导出备份'}render();return}
 if(msg.id){const i=data.chats.findIndex(c=>c.id===msg.id);if(i<0)return;ci=i;render()}
 if(msg.kind==='kakao-message'){const row=document.querySelector('[data-message-index="'+msg.index+'"]');if(row){row.classList.add('selected');row.scrollIntoView({block:'nearest',behavior:'smooth'});row.querySelector('textarea,input')?.focus()}}
 if(msg.kind==='kakao-insert'){let type=prompt('输入 1 添加消息，输入 2 添加日期时间分隔','2');if(!['1','2'].includes(type))return;data.chats[ci].messages.splice(msg.index,0,type==='2'?{type:'divider',date:'',time:''}:{text:'',mine:false,sender:data.chats[ci].name});save();render()}
});
initPreview().catch(e=>$('#status').textContent='预览载入失败：'+e.message);

try{data=JSON.parse(localStorage.getItem('kakao-editor-draft'));}catch{}if(data)render();else load().catch(e=>$('#status').textContent='载入失败：'+e.message);
</script>
