<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>本地音乐编辑器</title>
<style>body{font:15px system-ui;background:#17131f;color:#f9f7ff;max-width:1000px;margin:35px auto;padding:20px}button,input{font:inherit;padding:10px;border-radius:9px;border:0;margin:6px}button{background:#d6b9ff;cursor:pointer}article{display:flex;gap:25px;background:#2a2235;padding:22px;margin:20px 0;border-radius:20px}img{width:180px;height:180px;object-fit:cover;border-radius:12px}label{display:block}input{background:#42364e;color:white}small{display:block;color:#c9bcd6}#status{padding:10px}</style>
<h1>音乐内容编辑器</h1><p>修改手机网页里的歌曲名、歌手、专辑和封面。封面自动居中裁为正方形，支持 HEIC。</p>
<button id="reload">载入网页歌曲</button><button id="add">添加歌曲</button><button id="export">导出音乐数据</button><label>导入 JSON <input type="file" id="import" accept="application/json"></label><div id="status"></div><main id="songs"></main>
<script>
let songs=[];const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const draftDB=new Promise((resolve,reject)=>{const r=indexedDB.open('music-editor',1);r.onupgradeneeded=()=>r.result.createObjectStore('drafts');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});
async function save(){try{const db=await draftDB;await new Promise((resolve,reject)=>{const tx=db.transaction('drafts','readwrite');tx.objectStore('drafts').put(songs,'current');tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});$('#status').textContent='已保存草稿（含音频）'}catch{$('#status').textContent='草稿保存失败，请导出音乐数据备份'}}
async function uploadAudio(song,file){
 $('#status').textContent='正在读取音频…';
 const url=URL.createObjectURL(file),player=new Audio();player.preload='metadata';
 try{
  const duration=await new Promise((resolve,reject)=>{player.onloadedmetadata=()=>Number.isFinite(player.duration)&&player.duration>0?resolve(player.duration):reject(Error('无法读取音频时长'));player.onerror=()=>reject(Error('浏览器无法播放这个音频，请使用 MP3、M4A 或 WAV'));player.src=url});
  const data=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(Error('音频读取失败'));reader.readAsDataURL(file)});
  song.audio=data;song.audioName=file.name;song.duration=duration;await save();render();
 }catch(e){$('#status').textContent=e.message}finally{player.removeAttribute('src');player.load();URL.revokeObjectURL(url)}
}
async function load(){let h=await(await fetch('index.html',{cache:'no-store'})).text();let a=h.indexOf('const playlist=')+'const playlist='.length,b=h.indexOf(';\nlet song=',a);songs=Function('return ('+h.slice(a,b)+')')();save();render()}
async function cover(song,file){try{let blob=file;const sig=String.fromCharCode(...new Uint8Array(await file.slice(0,64).arrayBuffer()));if(/ftyp(?:heic|heix|hevc|hevx|mif1|msf1|heif)/.test(sig)||/\.hei[cf]$/i.test(file.name)){const r=await fetch('/convert-heic',{method:'POST',body:file});if(!r.ok)throw Error('HEIC 转换失败');blob=await r.blob()}const url=URL.createObjectURL(blob),img=new Image();await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=()=>reject(Error('无法读取图片'));img.src=url});const size=Math.min(img.width,img.height),c=document.createElement('canvas');c.width=c.height=600;c.getContext('2d').drawImage(img,(img.width-size)/2,(img.height-size)/2,size,size,0,0,600,600);song.cover=c.toDataURL('image/jpeg',.88);URL.revokeObjectURL(url);save();render()}catch(e){$('#status').textContent=e.message}}
function render(){const box=$('#songs');box.querySelectorAll('audio').forEach(a=>{a.pause();a.removeAttribute('src');a.load()});box.replaceChildren();songs.forEach((s,i)=>{const el=document.createElement('article');el.innerHTML='<div><img alt="歌曲封面" src="'+esc(s.cover)+'"><small>正方形封面预览</small></div><div><label>歌曲名<input data-key="name" value="'+esc(s.name)+'"></label><label>歌手<input data-key="artist" value="'+esc(s.artist)+'"></label><label>专辑<input data-key="album" value="'+esc(s.album)+'"></label><label>更换封面<input type="file" accept="image/*,.heic,.heif"></label><button class="delete-song">删除歌曲</button></div>';el.querySelectorAll('[data-key]').forEach(input=>input.oninput=()=>{s[input.dataset.key]=input.value;save()});el.querySelector('[type=file]').onchange=e=>{if(e.target.files[0])cover(s,e.target.files[0])};el.querySelector('.delete-song').onclick=()=>{if(songs.length===1){$('#status').textContent='至少保留一首歌曲';return}songs.splice(i,1);save();render()};const audioBox=document.createElement('div');audioBox.innerHTML='<label>上传音频<input type="file" accept="audio/*,.mp3,.m4a,.wav,.ogg,.aac,.flac"></label><small>'+esc(s.audioName||(s.audio?'已设置音频':'尚未上传，网页使用示例旋律'))+'</small>'+(s.audio?'<audio controls preload="metadata" src="'+esc(s.audio)+'"></audio><button class="remove-audio">移除音频</button>':'');audioBox.querySelector('input').onchange=e=>{if(e.target.files[0])uploadAudio(s,e.target.files[0])};const remove=audioBox.querySelector('.remove-audio');if(remove)remove.onclick=()=>{s.audio=null;delete s.audioName;s.duration=30;save();render()};el.lastElementChild.append(audioBox);box.append(el)})}
$('#reload').onclick=()=>{if(confirm('用网页歌曲替换当前草稿？'))load()};$('#add').onclick=()=>{songs.push({name:'新歌曲',artist:'',album:'',cover:'',duration:30,audio:null});save();render()};$('#export').onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify({playlist:songs},null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='music-data.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('#import').onchange=async e=>{try{const d=JSON.parse(await e.target.files[0].text());if(!Array.isArray(d.playlist)||!d.playlist.length)throw Error('没有歌曲');songs=d.playlist;save();render()}catch(err){$('#status').textContent=err.message}};(async()=>{try{const db=await draftDB;songs=await new Promise((resolve,reject)=>{const r=db.transaction('drafts').objectStore('drafts').get('current');r.onsuccess=()=>resolve(r.result||[]);r.onerror=()=>reject(r.error)})}catch{}if(!songs.length){try{songs=JSON.parse(localStorage.getItem('music-editor-draft-v1'))||[]}catch{}}if(songs.length)render();else await load()})().catch(e=>$('#status').textContent=e.message);
</script></html>
